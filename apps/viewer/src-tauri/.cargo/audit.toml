# cargo-audit configuration for breeze-viewer
#
# These advisories are known and unfixable from this crate's perspective —
# they are transitive dependencies pulled in by Tauri 2.x's Linux GTK3 stack
# (gtk-rs/atk/gdk/etc.) and HTML parsing chain (kuchikiki/markup5ever).
# Tauri has not migrated to GTK4 / newer html5ever yet.
#
# Re-evaluate this list whenever Tauri is upgraded.

[advisories]
ignore = [
  # GTK3 bindings — no longer maintained (Tauri-Linux only, no v2 alternative yet)
  "RUSTSEC-2024-0411", # gdkwayland-sys
  "RUSTSEC-2024-0412", # gdk
  "RUSTSEC-2024-0413", # atk
  "RUSTSEC-2024-0414", # gdkx11-sys
  "RUSTSEC-2024-0415", # gtk
  "RUSTSEC-2024-0416", # atk-sys
  "RUSTSEC-2024-0417", # gdkx11
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0420", # gtk-sys
  "RUSTSEC-2024-0429", # glib VariantStrIter unsoundness — Tauri-Linux only
  # Other unmaintained transitive deps from Tauri / html5ever
  "RUSTSEC-2024-0370", # proc-macro-error (Tauri build chain)
  "RUSTSEC-2025-0057", # fxhash (selectors → kuchikiki → wry)
  "RUSTSEC-2025-0075", # unic-char-range (idna chain)
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # rand 0.7.3 / 0.8.5 unsoundness — only triggered with custom logger using
  # rand::rng(); transitive via phf_generator → markup5ever → html5ever.
  "RUSTSEC-2026-0097",
  # quick-xml DoS pair — quadratic-time duplicate-attribute check (0194) and
  # unbounded namespace-declaration allocation in NsReader (0195). Both fixed
  # in quick-xml >= 0.41.0, but our only consumers are `plist` (Apple
  # property-list parsing of our OWN bundle metadata) and `wayland-scanner`
  # (build-time codegen from system Wayland protocol XML) — both trusted-input
  # paths, neither parses attacker-controlled XML at runtime. The fix is gated
  # behind plist/wayland-scanner releases pinned by the Tauri/Linux stack, so
  # it is unfixable from this crate's perspective.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # zip 4.6.1 extraction advisories (2026-10-09/10): SUID/SGID bits preserved
  # (0367), symlink targets outside the destination (0368), permissions applied
  # through symlinks (0369). All fixed only in zip >= 9.0.0; the sole consumer is
  # tauri-plugin-updater (`zip = "^4"` through stable 2.14.0; 3.x is alpha-only),
  # so `cargo update` cannot reach a patched zip. Risk assessment (2026-10-16):
  # the updater only extracts bundles it downloaded from our own update endpoint
  # AFTER minisign signature verification, so archive contents are first-party,
  # not attacker-controlled. Remove these three ids once a stable
  # tauri-plugin-updater release depends on zip >= 9.0.0 (tracked in #8910).
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # zbus stack unmaintained (2026-10-17): zvariant (0370), zbus_names (0371),
  # zvariant_derive (0372). Informational "unmaintained" notices, not
  # vulnerabilities; transitive via the Tauri Linux stack (tauri/wry/tray → zbus
  # 5.x), no direct dependency here. Not fixable from this crate. Re-evaluate
  # when tauri / tauri-plugin-* move to a maintained zbus line; remove these
  # three ids then (tracked in #9113).
  "RUSTSEC-2026-0370", # zvariant
  "RUSTSEC-2026-0371", # zbus_names
  "RUSTSEC-2026-0372", # zvariant_derive
]

# zip 4.6.1 is flagged "yanked" (no RUSTSEC id, so it cannot go in `ignore`
# above). Every zip 4.x/5.x release is yanked on crates.io, and the only
# consumer is tauri-plugin-updater (`zip = "^4"`, still the case in the latest
# stable 2.14.0; 3.0.0-alpha is the only newer line). It is unfixable from this
# crate: we cannot take the zip 9.x line without a Tauri updater release that
# does. The updater only unpacks update archives it downloaded from our own
# update endpoint AFTER minisign signature verification, so the archive is
# not attacker-controlled input.
#
# cargo-audit has no per-crate yanked exemption, so this disables the yanked
# check for the viewer crate only (the helper crate keeps it). Real RUSTSEC
# vulnerabilities/unmaintained/unsound advisories are still denied.
# Re-evaluate when tauri-plugin-updater moves off zip 4.x.
[yanked]
enabled = false
