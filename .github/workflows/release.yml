  promote-signed-release-images:
    name: Promote signed ${{ matrix.image.name }} image
    runs-on: ubuntu-latest
    needs: [create-release]
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.create-release.result == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, moving_channels: true }
          - { name: web, moving_channels: true }
          - { name: portal, moving_channels: true }
          - { name: binaries, moving_channels: true }
          - { name: m365-graph-read-executor, moving_channels: false }
          - { name: m365-graph-actions-executor, moving_channels: false }
          - { name: m365-communications-executor, moving_channels: false }
    steps:
      - name: Checkout verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download signed release image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-image-manifest
          path: signed-release-image-manifest

      - name: Verify signed image inventory and select exact digest
        env:
          RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS: ${{ secrets.RELEASE_MANIFEST_ED25519_PUBLIC_KEY }}
          IMAGE_NAME: ${{ matrix.image.name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest="signed-release-image-manifest/release-artifact-manifest.json"
          signature="signed-release-image-manifest/release-artifact-manifest.json.ed25519"
          node scripts/release/release-image-manifest.mjs verify \
            --manifest "$manifest" --signature "$signature" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-release "$EXPECTED_RELEASE"
          node - "$manifest" "$IMAGE_NAME" "$GITHUB_ENV" <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const [manifestPath, imageName, githubEnv] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const image = manifest.images.find((entry) => entry.name === imageName);
          if (!image) throw new Error(`signed image ${imageName} is missing`);
          appendFileSync(githubEnv, `SIGNED_IMAGE_REPOSITORY=${image.repository}\nSIGNED_IMAGE_DIGEST=${image.digest}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact signed digest
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          MOVING_CHANNELS: ${{ matrix.image.moving_channels }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_REF_NAME#v}"
          SHORT_SHA="${RELEASE_SHA::7}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Image promotion requires an exact semver release tag" >&2
            exit 1
          fi
          tags=(
            --tag "${SIGNED_IMAGE_REPOSITORY}:${VERSION}"
            --tag "${SIGNED_IMAGE_REPOSITORY}:sha-${SHORT_SHA}"
          )
          if [[ "$MOVING_CHANNELS" == "true" ]]; then
            MAJOR="${VERSION%%.*}"
            remainder="${VERSION#*.}"
            MINOR="${remainder%%.*}"
            tags+=(--tag "${SIGNED_IMAGE_REPOSITORY}:${MAJOR}.${MINOR}")
            tags+=(--tag "${SIGNED_IMAGE_REPOSITORY}:${MAJOR}")
            if [[ "$VERSION" != *-* ]]; then
              tags+=(--tag "${SIGNED_IMAGE_REPOSITORY}:latest")
            fi
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${SIGNED_IMAGE_REPOSITORY}@${SIGNED_IMAGE_DIGEST}"
