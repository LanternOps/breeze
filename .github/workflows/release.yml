          context: .
          file: apps/web/Dockerfile
          build-contexts: |
            release-dist=${{ runner.temp }}/release-dist
          outputs: type=image,name=${{ env.IMAGE_BASE }}/web,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: |
            type=gha,scope=server-web-build
            type=gha,scope=server-web
          cache-to: type=gha,mode=max,scope=server-web

      - name: Record signed-manifest input
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          node scripts/release/release-image-manifest.mjs record \
            --name web --repository "${IMAGE_BASE}/web" \
            --digest "$IMAGE_DIGEST" --source-commit "$GITHUB_SHA" \
            --output web.json

