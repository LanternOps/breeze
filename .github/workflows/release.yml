          # Strip prerelease suffix for WiX/Tauri/Cargo compatibility (e.g. 0.11.3-rc.1 → 0.11.3)
          MSI_VERSION="${BUILD_VERSION%%-*}"
          sed -i.bak 's/"version": "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"/"version": "'"$MSI_VERSION"'"/' src-tauri/tauri.conf.json && rm src-tauri/tauri.conf.json.bak
          sed -i.bak 's/^version = "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"/version = "'"$MSI_VERSION"'"/' src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak
          sed -i.bak 's/"version": "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"/"version": "'"$MSI_VERSION"'"/' package.json && rm package.json.bak
          echo "Injected version $MSI_VERSION into helper config files (from $BUILD_VERSION)"

      - name: Build Tauri app
        working-directory: apps/helper
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Find and rename artifact
        shell: bash
        working-directory: apps/helper
        run: |
          asset=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$asset" ]; then
            echo "ERROR: No DMG found"
            ls -R src-tauri/target/*/release/bundle/ || true
            exit 1
          fi
          cp "$asset" breeze-helper-macos.dmg

      - name: Notarize and staple DMG
        shell: bash
        working-directory: apps/helper
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          "$GITHUB_WORKSPACE/scripts/release/notarize-submit.sh" breeze-helper-macos.dmg
          xcrun stapler staple breeze-helper-macos.dmg
          xcrun stapler validate breeze-helper-macos.dmg

      - name: Upload Helper macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breeze-helper-macos.dmg
          path: apps/helper/breeze-helper-macos.dmg
          retention-days: 30

  resolve-windows-signing-provider:
    name: Resolve Windows signing provider
    needs: [classify-release]
    if: >-
      vars.ENABLE_WINDOWS_SIGNING == 'true'
      && github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.classify-release.outputs.release_kind == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      provider: ${{ steps.provider.outputs.provider }}
    steps:
      - name: Checkout resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate provider
        id: provider
        shell: bash
        env:
          RAW_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
        run: |
          set -euo pipefail
          node .github/scripts/resolve-windows-signing-provider.mjs "$RAW_PROVIDER" >> "$GITHUB_OUTPUT"

  sign-windows-tauri-azure:
    name: Sign Windows Tauri artifacts (Azure)
    needs: [build-viewer, build-helper, resolve-windows-signing-provider, classify-release]
    if: >-
      needs.resolve-windows-signing-provider.outputs.provider == 'azure'
      && github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.classify-release.outputs.release_kind == 'full'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ contains(github.ref_name, '-') && 'signing-prerelease' || 'signing-production' }}
    steps:
      - name: Checkout signature verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download viewer Windows MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: breeze-viewer-windows.msi
          path: staging/

      - name: Download helper Windows MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: breeze-helper-windows.msi
          path: staging/

      - name: Validate signing configuration (Azure)
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_PROD: ${{ secrets.AZURE_CERT_PROFILE_PROD }}
          AZURE_CERT_PROFILE_PRERELEASE: ${{ secrets.AZURE_CERT_PROFILE_PRERELEASE }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          $required = @("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SIGNING_ENDPOINT", "AZURE_SIGNING_ACCOUNT_NAME")
          # The certificate profile selects WHICH certificate signs. Omitting it
          # here let a half-populated signing environment surface as an opaque
          # failure inside azure/artifact-signing-action instead of a named
          # missing secret.
          if ($env:IS_PRERELEASE -eq "true") {
            $required += "AZURE_CERT_PROFILE_PRERELEASE"
          } else {
            $required += "AZURE_CERT_PROFILE_PROD"
          }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing required signing secret: $name"
            }
          }

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign viewer MSI (stable profile)
        if: ${{ !contains(github.ref_name, '-') }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_PROD }}
          files: ${{ github.workspace }}/staging/breeze-viewer-windows.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign viewer MSI (prerelease profile)
        if: ${{ contains(github.ref_name, '-') }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_PRERELEASE }}
          files: ${{ github.workspace }}/staging/breeze-viewer-windows.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign helper MSI (stable profile)
        if: ${{ !contains(github.ref_name, '-') }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_PROD }}
          files: ${{ github.workspace }}/staging/breeze-helper-windows.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign helper MSI (prerelease profile)
        if: ${{ contains(github.ref_name, '-') }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_PRERELEASE }}
          files: ${{ github.workspace }}/staging/breeze-helper-windows.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ env.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        run: |
          & .github/scripts/Verify-WindowsSignature.ps1 `
            -Path "staging/breeze-viewer-windows.msi", "staging/breeze-helper-windows.msi" `
            -ExpectedSubject $env:EXPECTED_SUBJECT `
            -AllowUnpinnedLeaf

      - name: Upload signed viewer MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breeze-viewer-windows.msi
          path: staging/breeze-viewer-windows.msi
          overwrite: true
          retention-days: 30

      - name: Upload signed helper MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breeze-helper-windows.msi
          path: staging/breeze-helper-windows.msi
          overwrite: true
          retention-days: 30

  sign-windows-tauri-sslcom:
    name: Sign Windows Tauri artifacts (SSL.com)
    needs: [build-viewer, build-helper, resolve-windows-signing-provider, classify-release]
    if: >-
      needs.resolve-windows-signing-provider.outputs.provider == 'sslcom'
      && github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.classify-release.outputs.release_kind == 'full'
    runs-on: windows-latest
    permissions:
      contents: read
    environment:
      name: ${{ contains(github.ref_name, '-') && 'signing-prerelease' || 'signing-production' }}
    steps:
      - name: Checkout signature verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/release-provenance/sslcom-tls-rsa-root-ca-2022.pem

      - name: Download viewer Windows MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: breeze-viewer-windows.msi
          path: staging/

      - name: Download helper Windows MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: breeze-helper-windows.msi
          path: staging/

      - name: Validate signing configuration (SSL.com)
        shell: pwsh
        env:
          SSLCOM_USERNAME: ${{ secrets.SSLCOM_USERNAME }}
          SSLCOM_PASSWORD: ${{ secrets.SSLCOM_PASSWORD }}
          SSLCOM_CREDENTIAL_ID: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          SSLCOM_TOTP_SECRET: ${{ secrets.SSLCOM_TOTP_SECRET }}
          SSLCOM_CERT_SHA256: ${{ secrets.SSLCOM_CERT_SHA256 }}
          SSLCOM_ENVIRONMENT_LABEL: ${{ secrets.SSLCOM_ENVIRONMENT_LABEL }}
          EXPECTED_ENVIRONMENT: ${{ contains(github.ref_name, '-') && 'signing-prerelease' || 'signing-production' }}
        run: |
          $required = @("SSLCOM_USERNAME", "SSLCOM_PASSWORD", "SSLCOM_CREDENTIAL_ID", "SSLCOM_TOTP_SECRET", "SSLCOM_CERT_SHA256", "SSLCOM_ENVIRONMENT_LABEL")
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing required signing secret: $name"
            }
          }

          # Stable and prerelease tags MUST resolve different eSigner
          # credentials, and the only thing that separates them is which GitHub
          # Environment the secrets live in. Nothing about the YAML differs
          # between the two, so if an operator adds SSLCOM_* at REPOSITORY level
          # -- the path of least resistance, and how every AZURE_* secret is
          # stored today -- both environments would silently resolve the same
          # credential and a prerelease tag would be signed with the production
          # certificate. This label can only match one environment, so putting
          # all six at repository level fails one of them loudly instead.
          #
          # Scope, honestly: this catches the LIKELY mistake, not every one. An
          # operator who scopes only this label per environment while leaving
          # the four credentials at repository level still passes. Environment
          # variables and environment secrets have identical override
          # semantics, so storing it as a secret buys no extra guarantee -- it
          # is kept alongside the credentials as a nudge, and it costs the
          # ability to echo the value (GitHub masks it), which is why the error
          # below names the environment rather than the label.
          if ($env:SSLCOM_ENVIRONMENT_LABEL -ne $env:EXPECTED_ENVIRONMENT) {
            # Do not interpolate the label: it is stored as a secret, so its
            # value is masked in the log and would print as '***'.
            throw "SSLCOM_ENVIRONMENT_LABEL does not match '$($env:EXPECTED_ENVIRONMENT)', the environment this job is running in. Add the SSLCOM_* secrets to the signing-production and signing-prerelease environments individually -- not to the repository -- and set SSLCOM_ENVIRONMENT_LABEL in each to that environment's own name."
          }

      # SUPPLY CHAIN: the action pin below is a 40-char commit SHA, but at
      # runtime that action fetches CodeSignTool from a MUTABLE GitHub release
      # asset with no checksum and executes it in this job, alongside the
      # eSigner credentials. The pin does not cover that download. Pre-stage the
      # archive here with a verified digest and export CODESIGNTOOL_PATH, which
      # the action honours to skip its own fetch.
      #
      # JAVA_VERSION suppresses a second unverified download: the action installs
      # Amazon Corretto resolved from a floating "latest" index (and reads, but
      # never compares, the checksum that index publishes) whenever JAVA_VERSION
      # is below 11. Nothing needs it -- CodeSignTool.bat runs the jdk-11.0.2
      # bundled inside the verified archive.
      - name: Stage CodeSignTool (pinned + checksum-verified)
        shell: pwsh
        env:
          CODESIGNTOOL_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip
          CODESIGNTOOL_SHA256: e22094505decbe622afe5b0c27abc618ed2ba179bd94f3450490352399d5ef2a
          SSLCOM_TLS_ROOT_2022_SHA256: 8FAF7D2E2CB4709BB8E0B33666BF75A5DD45B5DE480F8EA8D4BFE6BEBC17F2ED
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP "CodeSignTool-v1.3.0-windows.zip"
          $target = Join-Path $env:RUNNER_TEMP "CodeSignTool-v1.3.0"

          # No degraded path exists downstream: this step failing aborts the
          # whole tag release. The digest check below makes a retry safe.
          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $archive `
            -MaximumRetryCount 3 -RetryIntervalSec 15 -TimeoutSec 900
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CODESIGNTOOL_SHA256) {
            throw "CodeSignTool digest mismatch. Expected $($env:CODESIGNTOOL_SHA256); got $actual"
          }

          Expand-Archive -Path $archive -DestinationPath $target -Force
          foreach ($required in @("CodeSignTool.bat", "conf", "jar", "jdk-11.0.2")) {
            if (-not (Test-Path (Join-Path $target $required))) {
              throw "CodeSignTool archive verified but missing expected entry: $required"
            }
          }

          # cs.ssl.com moved its TLS chain to "SSL.com TLS RSA Root CA 2022" on
          # 2026-09-22. The jdk-11.0.2 bundled in CodeSignTool predates that
          # root, so every eSigner call failed PKIX path building (v0.116.0
          # release run 35816104938). Trust exactly that root, from a committed
          # PEM whose SHA-256 is pinned here, in the bundled JDK's cacerts.
          $rootPem = Join-Path $env:GITHUB_WORKSPACE ".github/release-provenance/sslcom-tls-rsa-root-ca-2022.pem"
          $rootCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($rootPem)
          $rootSha256 = $rootCert.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256)
          if ($rootSha256 -ne $env:SSLCOM_TLS_ROOT_2022_SHA256) {
            throw "SSL.com TLS root digest mismatch. Expected $($env:SSLCOM_TLS_ROOT_2022_SHA256); got $rootSha256"
          }
          $jdk = Join-Path $target "jdk-11.0.2"
          & (Join-Path $jdk "bin\keytool.exe") -importcert -noprompt -alias sslcom-tls-rsa-root-ca-2022 `
            -file $rootPem -keystore (Join-Path $jdk "lib\security\cacerts") -storepass changeit
          if ($LASTEXITCODE -ne 0) { throw "keytool failed to import the SSL.com TLS root ($LASTEXITCODE)" }

          "CODESIGNTOOL_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_VERSION=17" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # SSL.com eSigner signs each staged MSI in place. `malware_block: true`
      # aborts the release if the eSigner malware scan flags a payload.
      #
      # `clean_logs` is deliberately NOT set: it is a no-op in this action.
      # main.ts computes `path.dirname(command)` where `command` is the whole
      # command STRING, so it truncates inside the quoted -input_file_path and
      # deletes a nonexistent directory that `force: true` then swallows.
      - name: Sign viewer MSI (SSL.com)
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSLCOM_USERNAME }}
          password: ${{ secrets.SSLCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLCOM_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/staging/breeze-viewer-windows.msi
          override: true
          malware_block: true

      - name: Sign helper MSI (SSL.com)
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSLCOM_USERNAME }}
          password: ${{ secrets.SSLCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLCOM_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/staging/breeze-helper-windows.msi
          override: true
          malware_block: true

      # No leaf pin on the Azure twin: Azure Artifact Signing certificates are
      # short-lived and rotate automatically, so identity is asserted by subject
      # there and by subject + pin here.
      - name: Verify signatures
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ env.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
          SSLCOM_CERT_SHA256: ${{ secrets.SSLCOM_CERT_SHA256 }}
        run: |
          & .github/scripts/Verify-WindowsSignature.ps1 `
            -Path "staging/breeze-viewer-windows.msi", "staging/breeze-helper-windows.msi" `
            -ExpectedSubject $env:EXPECTED_SUBJECT `
            -ExpectedThumbprintSha256 $env:SSLCOM_CERT_SHA256

      - name: Upload signed viewer MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breeze-viewer-windows.msi
          path: staging/breeze-viewer-windows.msi
          overwrite: true
          retention-days: 30

      - name: Upload signed helper MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breeze-helper-windows.msi
          path: staging/breeze-helper-windows.msi
          overwrite: true
          retention-days: 30

  sign-windows-tauri:
    name: Windows Tauri signing convergence gate
    needs: [resolve-windows-signing-provider, sign-windows-tauri-azure, sign-windows-tauri-sslcom, classify-release]
    if: ${{ !cancelled() && needs.resolve-windows-signing-provider.result != 'skipped' && needs.classify-release.outputs.release_kind == 'full' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Republished so the release manifest can record which CA vouched for the
    # Windows artifacts. Without it a provider switch is invisible to every
    # downstream verifier holding the manifest signing key.
    outputs:
      provider: ${{ needs.resolve-windows-signing-provider.outputs.provider }}
    steps:
      - name: Checkout convergence assertion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assert single-provider convergence
        shell: bash
        env:
          PROVIDER: ${{ needs.resolve-windows-signing-provider.outputs.provider }}
          AZURE_RESULT: ${{ needs.sign-windows-tauri-azure.result }}
          SSLCOM_RESULT: ${{ needs.sign-windows-tauri-sslcom.result }}
        run: |
          set -euo pipefail
          node .github/scripts/assert-windows-signing-convergence.mjs "$PROVIDER" "$AZURE_RESULT" "$SSLCOM_RESULT"

  package-windows-updater:
    name: Package Windows Updater Bundle
    # `!cancelled()` + an explicit result check, not the implicit `success()`:
    # exactly one of sign-windows-tauri-{azure,sslcom} is always skipped (the
    # non-selected provider), and the implicit success() is evaluated over the
    # whole transitive needs chain, so without this the bundle job is skipped
    # and release-integrity-gate fails closed on it (v0.107.0-rc.1).
    if: >-
      !cancelled()
      && needs.sign-windows-tauri.result == 'success'
      && vars.ENABLE_WINDOWS_SIGNING == 'true'
      && github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.classify-release.outputs.release_kind == 'full'
    runs-on: ubuntu-latest
    needs: [sign-windows-tauri, classify-release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download signed viewer MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: breeze-viewer-windows.msi
          path: staging/

      # Stored, not deflated: the updater's Windows extractor has no Deflate
      # decoder, so a compressed bundle never installs (#7681). The script
      # verifies the archive and fails the job if the entry is compressed.
      - name: Create updater zip
        run: |
          bash scripts/release/package-viewer-windows-updater.sh \
            staging/breeze-viewer-windows.msi \
            staging/breeze-viewer-windows.msi.zip

      - name: Minisign the zip with Tauri key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$key_file"
          unset TAURI_SIGNING_PRIVATE_KEY
          cd apps/viewer
          pnpm exec tauri signer sign -f "$key_file" "$GITHUB_WORKSPACE/staging/breeze-viewer-windows.msi.zip"
          if [ ! -s "$GITHUB_WORKSPACE/staging/breeze-viewer-windows.msi.zip.sig" ]; then
            echo "::error::Tauri signer did not produce .sig file"
            exit 1
          fi

      - name: Upload Windows updater bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: breeze-viewer-windows-updater
          path: |
            staging/breeze-viewer-windows.msi.zip
            staging/breeze-viewer-windows.msi.zip.sig
          retention-days: 30

  merge-viewer-update-manifest:
    name: Generate Viewer Update Manifest
    runs-on: ubuntu-latest
    needs: [build-viewer, build-viewer-macos, package-windows-updater, classify-release]
    # Explicitly gated on the release kind: this job accepts `skipped` parents,
    # so a server-only release (every parent skipped) would otherwise RUN it and
    # fail on an empty platform set. carry-forward-binaries supplies latest.json.
    if: >-
      !cancelled()
      && (needs.build-viewer.result == 'success' || needs.build-viewer.result == 'skipped')
      && (needs.build-viewer-macos.result == 'success' || needs.build-viewer-macos.result == 'skipped')
      && (needs.package-windows-updater.result == 'success' || needs.package-windows-updater.result == 'skipped')
      && needs.classify-release.outputs.release_kind == 'full'
    steps:
      - name: Download viewer updater bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: updater-bundles
          pattern: 'breeze-viewer-*-updater'
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          WIN_UPDATER_RESULT: ${{ needs.package-windows-updater.result }}
        run: |
          # Strip leading "v" and any prerelease suffix so the version matches
          # the one injected into tauri.conf.json at build time.
          version="${REF_NAME#v}"
          version="${version%%-*}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          release_base="${SERVER_URL}/${REPO}/releases/download/${REF_NAME}"
          notes_url="${SERVER_URL}/${REPO}/releases/tag/${REF_NAME}"

          echo "Downloaded updater bundle contents:"
          ls -la updater-bundles/ || true

          platforms='{}'

          # macOS — Tauri builds a universal binary, so the same bundle
          # satisfies both x86_64 and aarch64 clients.
          mac_sig="updater-bundles/breeze-viewer-macos.app.tar.gz.sig"
          if [ -f "$mac_sig" ]; then
            sig_content=$(cat "$mac_sig")
            url="${release_base}/breeze-viewer-macos.app.tar.gz"
            platforms=$(jq -n \
              --arg sig "$sig_content" \
              --arg url "$url" \
              '{"darwin-x86_64": {signature: $sig, url: $url}, "darwin-aarch64": {signature: $sig, url: $url}}')
          else
            echo "::warning::macOS updater signature not found — macOS auto-update disabled for this release"
          fi

          # Linux AppImage
          linux_sig="updater-bundles/breeze-viewer-linux.AppImage.sig"
          if [ -f "$linux_sig" ]; then
            sig_content=$(cat "$linux_sig")
            url="${release_base}/breeze-viewer-linux.AppImage"
            platforms=$(echo "$platforms" | jq \
              --arg sig "$sig_content" \
              --arg url "$url" \
              '. + {"linux-x86_64": {signature: $sig, url: $url}}')
          else
            echo "::warning::Linux updater signature not found — Linux auto-update disabled for this release"
          fi

          # Windows MSI updater bundle
          win_sig="updater-bundles/breeze-viewer-windows.msi.zip.sig"
          if [ -f "$win_sig" ]; then
            sig_content=$(cat "$win_sig")
            url="${release_base}/breeze-viewer-windows.msi.zip"
            platforms=$(echo "$platforms" | jq \
              --arg sig "$sig_content" \
              --arg url "$url" \
              '. + {"windows-x86_64": {signature: $sig, url: $url}}')
          elif [ "$WIN_UPDATER_RESULT" = "success" ]; then
            echo "::error::package-windows-updater reported success but no sig found at $win_sig"
            exit 1
          else
            echo "::warning::Windows updater signature not found (upstream result: $WIN_UPDATER_RESULT) — Windows auto-update disabled for this release"
          fi

          if [ "$(echo "$platforms" | jq 'keys | length')" = "0" ]; then
            echo "::error::No updater platforms available — latest.json would be useless"
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "See release notes at $notes_url" \
            --arg pub_date "$pub_date" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload generated manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: viewer-latest-json
          path: latest.json
          retention-days: 30

  validate-release-lineage:
    name: Validate Release Lineage
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !(github.event_name == 'workflow_dispatch' && inputs.skip_release)
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.lineage.outputs.channel }}
      tag: ${{ steps.lineage.outputs.tag }}
      tag_sha: ${{ steps.lineage.outputs.tag_sha }}
    steps:
      - name: Checkout full release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve authoritative main ref
        run: git rev-parse --verify 'origin/main^{commit}'

      - name: Classify exact release lineage
        id: lineage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release/check-release-lineage.sh \
            --tag "$RELEASE_TAG" \
            --main-ref origin/main \
            --candidate-registry-ref origin/main

  # Server-only releases (.github/release-provenance/server-only-tags.tsv):
  # a tag listed in the ledger ON MAIN is checked by the eligibility guard
  # executed from the base (last full) release's tree. Eligible => every
  # binary/signing/notarization job below is skipped and the base release's
  # binaries image and Viewer latest.json are carried forward. A listed tag the
  # guard refuses FAILS here — it never silently falls back to a full release.
  # Build-only runs and unlisted tags are `full`, exactly as before this job.
  classify-release:
    name: Classify Release Kind
    runs-on: ubuntu-latest
    needs: [validate-release-lineage]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    outputs:
      release_kind: ${{ steps.classify.outputs.release_kind }}
      binaries_tag: ${{ steps.classify.outputs.binaries_tag }}
      binaries_sha: ${{ steps.classify.outputs.binaries_sha }}
      binaries_version: ${{ steps.classify.outputs.binaries_version }}
    steps:
      - name: Checkout full release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Classify release kind
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS: ${{ secrets.RELEASE_MANIFEST_ED25519_PUBLIC_KEY }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SKIP_RELEASE: ${{ inputs.skip_release || false }}
          LINEAGE_RESULT: ${{ needs.validate-release-lineage.result }}
          LINEAGE_CHANNEL: ${{ needs.validate-release-lineage.outputs.channel }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/server-only-classification.json"
          if [[ "$REF_TYPE" != "tag" || "$REF" != refs/tags/v* ]] \
             || [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_RELEASE" == "true" ]]; then
            echo "Build-only run: classified as a full release."
            echo "release_kind=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$LINEAGE_RESULT" != "success" ]]; then
            echo "::error::release lineage must be validated before classification (validate-release-lineage: '$LINEAGE_RESULT')"
            exit 1
          fi
          git rev-parse --verify 'origin/main^{commit}' >/dev/null
          set +e
          bash scripts/release/run-server-only-guard.sh \
            --tag "$REF_NAME" \
            --commit "$(git rev-parse 'HEAD^{commit}')" \
            --ledger-ref origin/main \
            --main-ref origin/main \
            --online \
            --expected-repository "$GITHUB_REPOSITORY" \
            --report "$report"
          status=$?
          set -e
          case "$status" in
            3)
              echo "$REF_NAME is not listed in the server-only ledger on main: full release."
              echo "release_kind=full" >> "$GITHUB_OUTPUT"
              ;;
            0)
              if [[ "$LINEAGE_CHANNEL" != "mainline" ]]; then
                echo "::error::a server-only release requires mainline release lineage (got '$LINEAGE_CHANNEL')"
                exit 1
              fi
              node - "$report" "$REF_NAME" "$GITHUB_OUTPUT" <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const [reportPath, tag, output] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const stable = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          if (report.tag !== tag) throw new Error(`classification report is for ${report.tag}, not ${tag}`);
          if (!stable.test(report.base ?? '') || report.base === tag) throw new Error(`invalid base ${report.base}`);
          if (!/^[0-9a-f]{40}$/u.test(report.baseSha ?? '')) throw new Error('invalid base commit');
          if (report.binariesVersion !== report.base.slice(1)) throw new Error('binariesVersion does not match the base tag');
          appendFileSync(output, [
            'release_kind=server-only',
            `binaries_tag=${report.base}`,
            `binaries_sha=${report.baseSha}`,
            `binaries_version=${report.binariesVersion}`,
            '',
          ].join('\n'));
          console.log(`${tag} is a server-only release; binaries carried from ${report.base} (${report.baseSha}).`);
          NODE
              ;;
            *)
              echo "::error::$REF_NAME is listed in the server-only ledger but the eligibility guard refused it; refusing to fall back to a full release. The row for an existing tag cannot be edited or removed: add a corrected row for a new tag (or cut a full release) and push that new tag."
              exit 1
              ;;
          esac

      - name: Upload server-only classification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-only-classification
          path: ${{ runner.temp }}/server-only-classification.json
          if-no-files-found: ignore
          retention-days: 90

  # Server-only only: carries the base release's binaries image (by its signed
  # digest) and Viewer latest.json (byte-identical) into this release. Verifies
  # the base's signed manifest first; never builds, signs or retags anything.
  carry-forward-binaries:
    name: Carry Forward Binaries (server-only)
    runs-on: ubuntu-latest
    needs: [classify-release]
    if: >-
      !cancelled()
      && needs.classify-release.result == 'success'
      && needs.classify-release.outputs.release_kind == 'server-only'
    permissions:
      contents: read
      packages: read
    env:
      BINARIES_TAG: ${{ needs.classify-release.outputs.binaries_tag }}
      BINARIES_SHA: ${{ needs.classify-release.outputs.binaries_sha }}
      BINARIES_VERSION: ${{ needs.classify-release.outputs.binaries_version }}
    steps:
      - name: Checkout verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the base release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS: ${{ secrets.RELEASE_MANIFEST_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/base-release"
          mkdir -p "$base_dir"
          gh release download "$BINARIES_TAG" --repo "$GITHUB_REPOSITORY" --dir "$base_dir" \
            --pattern release-artifact-manifest.json \
            --pattern release-artifact-manifest.json.ed25519
          node scripts/release/release-image-manifest.mjs verify \
            --manifest "$base_dir/release-artifact-manifest.json" \
            --signature "$base_dir/release-artifact-manifest.json.ed25519" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-release "$BINARIES_TAG" \
            --require-kind full \
            --output "$base_dir/identity.json"
          node - "$base_dir/identity.json" "$BINARIES_SHA" "$GITHUB_ENV" <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const [identityPath, expectedSourceCommit, githubEnv] = process.argv.slice(2);
          const identity = JSON.parse(readFileSync(identityPath, 'utf8'));
          if (identity.sourceCommit !== expectedSourceCommit) {
            throw new Error(`base manifest sourceCommit ${identity.sourceCommit} != base tag commit ${expectedSourceCommit}`);
          }
          const binaries = identity.images.find((image) => image.name === 'binaries');
          if (!binaries) throw new Error('base manifest lists no binaries image');
          const latest = identity.assets.filter((asset) => asset.name === 'latest.json');
          if (latest.length > 1) throw new Error('base manifest lists latest.json more than once');
          const lines = [`CARRIED_REPOSITORY=${binaries.repository}`, `CARRIED_DIGEST=${binaries.digest}`];
          if (latest.length === 1) {
            const [entry] = latest;
            if (!/^[0-9a-f]{64}$/u.test(entry.sha256 ?? '') || !Number.isInteger(entry.size)) {
              throw new Error('base manifest latest.json entry is malformed');
            }
            lines.push(`BASE_LATEST_SHA256=${entry.sha256}`, `BASE_LATEST_SIZE=${entry.size}`);
          }
          appendFileSync(githubEnv, `${lines.join('\n')}\n`);
          NODE

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the carried binaries image
        run: |
          set -euo pipefail
          ref="${CARRIED_REPOSITORY}@${CARRIED_DIGEST}"
          docker buildx imagetools inspect "$ref" >/dev/null
          docker pull --quiet "$ref" >/dev/null
          container=$(docker create "$ref")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/binaries/VERSION" "$RUNNER_TEMP/carried-VERSION"
          actual=$(tr -d '[:space:]' < "$RUNNER_TEMP/carried-VERSION")
          if [[ "$actual" != "$BINARIES_VERSION" ]]; then
            echo "::error::carried binaries image $ref has VERSION '$actual', expected '$BINARIES_VERSION'"
            exit 1
          fi
          echo "Carrying $ref (VERSION $actual) from $BINARIES_TAG"

      - name: Record carried signed-manifest input
        run: |
          node scripts/release/release-image-manifest.mjs record \
            --name binaries --repository "$CARRIED_REPOSITORY" \
            --digest "$CARRIED_DIGEST" --source-commit "$BINARIES_SHA" \
            --carried-from-release "$BINARIES_TAG" \
            --carried-from-source-commit "$BINARIES_SHA" \
            --output binaries.json

      - name: Upload carried binaries image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-binaries
          path: binaries.json
          retention-days: 90

      - name: Carry the Viewer update manifest byte-identical
        if: env.BASE_LATEST_SHA256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p carried-latest
          gh release download "$BINARIES_TAG" --repo "$GITHUB_REPOSITORY" --dir carried-latest --pattern latest.json
          actual_sha256=$(sha256sum carried-latest/latest.json | cut -d ' ' -f 1)
          actual_size=$(wc -c < carried-latest/latest.json | tr -d ' ')
          if [[ "$actual_sha256" != "$BASE_LATEST_SHA256" || "$actual_size" != "$BASE_LATEST_SIZE" ]]; then
            echo "::error::latest.json of $BINARIES_TAG does not match its signed manifest entry (sha256 $actual_sha256, size $actual_size)"
            exit 1
          fi
          # Every platform must still point at the base release, so Viewer
          # clients see no update and download nothing from this release.
          prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${BINARIES_TAG}/"
          node - carried-latest/latest.json "$prefix" <<'NODE'
          const { readFileSync } = require('node:fs');
          const [path, prefix] = process.argv.slice(2);
          const latest = JSON.parse(readFileSync(path, 'utf8'));
          const platforms = Object.entries(latest.platforms ?? {});
          if (platforms.length === 0) throw new Error('carried latest.json lists no platforms');
          for (const [platform, entry] of platforms) {
            if (typeof entry?.url !== 'string' || !entry.url.startsWith(prefix)) {
              throw new Error(`${platform} url ${entry?.url} is not under ${prefix}`);
            }
          }
          NODE

      - name: Upload carried Viewer update manifest
        if: env.BASE_LATEST_SHA256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: viewer-latest-json
          path: carried-latest/latest.json
          retention-days: 30

  release-integrity-gate:
    name: Release Integrity Gate
    runs-on: ubuntu-latest
    needs: [build-windows-unsigned, build-macos-agent, build-macos-installer-app, sign-windows-tauri, build-viewer-macos, build-helper-macos, package-windows-updater, merge-viewer-update-manifest, classify-release, carry-forward-binaries, build-agent, build-recovery-media, build-viewer, build-helper, resolve-windows-signing-provider, sign-windows-tauri-azure, sign-windows-tauri-sslcom, build-binaries-image]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Fail closed when release signing was skipped
        env:
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          SKIP_RELEASE: ${{ inputs.skip_release || false }}
          RELEASE_KIND: ${{ needs.classify-release.outputs.release_kind }}
          CLASSIFY_RELEASE_RESULT: ${{ needs.classify-release.result }}
          CARRY_FORWARD_BINARIES_RESULT: ${{ needs.carry-forward-binaries.result }}
          BUILD_AGENT_RESULT: ${{ needs.build-agent.result }}
          BUILD_RECOVERY_MEDIA_RESULT: ${{ needs.build-recovery-media.result }}
          BUILD_VIEWER_RESULT: ${{ needs.build-viewer.result }}
          BUILD_HELPER_RESULT: ${{ needs.build-helper.result }}
          RESOLVE_WINDOWS_SIGNING_PROVIDER_RESULT: ${{ needs.resolve-windows-signing-provider.result }}
          SIGN_WINDOWS_TAURI_AZURE_RESULT: ${{ needs.sign-windows-tauri-azure.result }}
          SIGN_WINDOWS_TAURI_SSLCOM_RESULT: ${{ needs.sign-windows-tauri-sslcom.result }}
          BUILD_BINARIES_IMAGE_RESULT: ${{ needs.build-binaries-image.result }}
          BUILD_WINDOWS_UNSIGNED_RESULT: ${{ needs.build-windows-unsigned.result }}
          BUILD_MACOS_AGENT_RESULT: ${{ needs.build-macos-agent.result }}
          BUILD_MACOS_INSTALLER_APP_RESULT: ${{ needs.build-macos-installer-app.result }}
          SIGN_WINDOWS_TAURI_RESULT: ${{ needs.sign-windows-tauri.result }}
          BUILD_VIEWER_MACOS_RESULT: ${{ needs.build-viewer-macos.result }}
          BUILD_HELPER_MACOS_RESULT: ${{ needs.build-helper-macos.result }}
          PACKAGE_WINDOWS_UPDATER_RESULT: ${{ needs.package-windows-updater.result }}
          MERGE_VIEWER_UPDATE_MANIFEST_RESULT: ${{ needs.merge-viewer-update-manifest.result }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_RELEASE" == "true" ]]; then
            echo "Build-only workflow_dispatch run: release signing gate is advisory."
            exit 0
          fi

          failed=0
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name must succeed for tag release $REF_NAME; got '$result'."
              failed=1
            fi
          }

          # Server-only: proof that no signing quota, notarization or binary
          # build ran — every one of these jobs must have been skipped.
          require_skipped() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "skipped" ]]; then
              echo "::error::$name must be skipped for server-only release $REF_NAME; got '$result'."
              failed=1
            fi
          }

          case "$RELEASE_KIND" in
            full)
              require_success "build-windows-unsigned" "$BUILD_WINDOWS_UNSIGNED_RESULT"
              require_success "build-macos-agent" "$BUILD_MACOS_AGENT_RESULT"
              require_success "build-macos-installer-app" "$BUILD_MACOS_INSTALLER_APP_RESULT"
              require_success "sign-windows-tauri" "$SIGN_WINDOWS_TAURI_RESULT"
              require_success "build-viewer-macos" "$BUILD_VIEWER_MACOS_RESULT"
              require_success "build-helper-macos" "$BUILD_HELPER_MACOS_RESULT"
              require_success "package-windows-updater" "$PACKAGE_WINDOWS_UPDATER_RESULT"
              require_success "merge-viewer-update-manifest" "$MERGE_VIEWER_UPDATE_MANIFEST_RESULT"
              ;;
            server-only)
              require_success "classify-release" "$CLASSIFY_RELEASE_RESULT"
              require_success "carry-forward-binaries" "$CARRY_FORWARD_BINARIES_RESULT"
              require_skipped "build-agent" "$BUILD_AGENT_RESULT"
              require_skipped "build-recovery-media" "$BUILD_RECOVERY_MEDIA_RESULT"
              require_skipped "build-windows-unsigned" "$BUILD_WINDOWS_UNSIGNED_RESULT"
              require_skipped "build-macos-agent" "$BUILD_MACOS_AGENT_RESULT"
              require_skipped "build-macos-installer-app" "$BUILD_MACOS_INSTALLER_APP_RESULT"
              require_skipped "build-viewer" "$BUILD_VIEWER_RESULT"
              require_skipped "build-helper" "$BUILD_HELPER_RESULT"
              require_skipped "build-viewer-macos" "$BUILD_VIEWER_MACOS_RESULT"
              require_skipped "build-helper-macos" "$BUILD_HELPER_MACOS_RESULT"
              require_skipped "resolve-windows-signing-provider" "$RESOLVE_WINDOWS_SIGNING_PROVIDER_RESULT"
              require_skipped "sign-windows-tauri-azure" "$SIGN_WINDOWS_TAURI_AZURE_RESULT"
              require_skipped "sign-windows-tauri-sslcom" "$SIGN_WINDOWS_TAURI_SSLCOM_RESULT"
              require_skipped "sign-windows-tauri" "$SIGN_WINDOWS_TAURI_RESULT"
              require_skipped "package-windows-updater" "$PACKAGE_WINDOWS_UPDATER_RESULT"
              require_skipped "merge-viewer-update-manifest" "$MERGE_VIEWER_UPDATE_MANIFEST_RESULT"
              require_skipped "build-binaries-image" "$BUILD_BINARIES_IMAGE_RESULT"
              ;;
            *)
              echo "::error::release kind '$RELEASE_KIND' is neither full nor server-only for tag release $REF_NAME (classify-release: '$CLASSIFY_RELEASE_RESULT')."
              failed=1
              ;;
          esac

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$RELEASE_KIND" == "server-only" ]]; then
            echo "Server-only release $REF_NAME: every binary/signing/notarization job was skipped and the base binaries were carried forward."
          else
            echo "All required signing/notarization jobs succeeded for tag release $REF_NAME."
          fi

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-api, build-web, build-agent, build-recovery-media, build-windows-unsigned, build-macos-agent, build-macos-installer-app, sign-windows-tauri, build-viewer, build-helper, build-viewer-macos, build-helper-macos, merge-viewer-update-manifest, package-windows-updater, release-integrity-gate, validate-release-lineage, build-binaries-image, build-docker-api, build-docker-web, build-docker-portal, build-docker-m365-graph-read-executor, build-docker-m365-graph-actions-executor, build-docker-m365-communications-executor, classify-release, carry-forward-binaries, resolve-windows-signing-provider, sign-windows-tauri-azure, sign-windows-tauri-sslcom]
    # The last conjunct is the release-kind split. The full branch is exactly
    # the pre-server-only condition; the server-only branch requires the
    # carried binaries and every binary/signing job to have been SKIPPED.
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.validate-release-lineage.result == 'success'
      && needs.classify-release.result == 'success'
      && needs.build-api.result == 'success'
      && needs.build-web.result == 'success'
      && needs.release-integrity-gate.result == 'success'
      && needs.build-docker-api.result == 'success'
      && needs.build-docker-web.result == 'success'
      && needs.build-docker-portal.result == 'success'
      && needs.build-docker-m365-graph-read-executor.result == 'success'
      && needs.build-docker-m365-graph-actions-executor.result == 'success'
      && needs.build-docker-m365-communications-executor.result == 'success'
      && !(github.event_name == 'workflow_dispatch' && inputs.skip_release)
      && (
        (needs.classify-release.outputs.release_kind == 'full'
          && needs.build-agent.result == 'success'
          && needs.build-recovery-media.result == 'success'
          && needs.build-windows-unsigned.result == 'success'
          && (needs.build-macos-agent.result == 'success' || needs.build-macos-agent.result == 'skipped')
          && (needs.build-macos-installer-app.result == 'success' || needs.build-macos-installer-app.result == 'skipped')
          && (needs.sign-windows-tauri.result == 'success' || needs.sign-windows-tauri.result == 'skipped')
          && (needs.package-windows-updater.result == 'success' || needs.package-windows-updater.result == 'skipped')
          && (needs.build-viewer.result == 'success' || needs.build-viewer.result == 'skipped')
          && (needs.build-helper.result == 'success' || needs.build-helper.result == 'skipped')
          && (needs.build-viewer-macos.result == 'success' || needs.build-viewer-macos.result == 'skipped')
          && (needs.build-helper-macos.result == 'success' || needs.build-helper-macos.result == 'skipped')
          && (needs.merge-viewer-update-manifest.result == 'success' || needs.merge-viewer-update-manifest.result == 'skipped')
          && needs.build-binaries-image.result == 'success')
        || (needs.classify-release.outputs.release_kind == 'server-only'
          && needs.carry-forward-binaries.result == 'success'
          && needs.build-agent.result == 'skipped'
          && needs.build-recovery-media.result == 'skipped'
          && needs.build-windows-unsigned.result == 'skipped'
          && needs.build-macos-agent.result == 'skipped'
          && needs.build-macos-installer-app.result == 'skipped'
          && needs.build-viewer.result == 'skipped'
          && needs.build-helper.result == 'skipped'
          && needs.build-viewer-macos.result == 'skipped'
          && needs.build-helper-macos.result == 'skipped'
          && needs.resolve-windows-signing-provider.result == 'skipped'
          && needs.sign-windows-tauri-azure.result == 'skipped'
          && needs.sign-windows-tauri-sslcom.result == 'skipped'
          && needs.sign-windows-tauri.result == 'skipped'
          && needs.package-windows-updater.result == 'skipped'
          && needs.merge-viewer-update-manifest.result == 'skipped'
          && needs.build-binaries-image.result == 'skipped')
      )
    permissions:
      contents: write
    env:
      RELEASE_KIND: ${{ needs.classify-release.outputs.release_kind }}
      BINARIES_TAG: ${{ needs.classify-release.outputs.binaries_tag }}
      BINARIES_SHA: ${{ needs.classify-release.outputs.binaries_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: '{api-dist,web-dist,breeze-agent-*,breeze-backup-*,breeze-desktop-helper-*,breeze-user-helper-*,breeze-watchdog-*,breeze-viewer-*,breeze-helper-*,breeze-installer-app,viewer-latest-json,macos-pkg-attestation,breeze-recovery-*}'
          merge-multiple: false

      - name: Download release image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-image-metadata
          pattern: 'release-image-*'
          merge-multiple: true

      - name: Download server-only classification report
        if: env.RELEASE_KIND == 'server-only'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: server-only-classification
          path: server-only-classification

      - name: Validate complete release image set
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          case "$RELEASE_KIND" in
            full)
              node scripts/release/release-image-manifest.mjs collect \
                --directory release-image-metadata \
                --source-commit "$SOURCE_COMMIT" \
                --release-kind full \
                --output release-images.json
              ;;
            server-only)
              # Only the carried binaries record may name the base commit;
              # its provenance is written to carried-images.json for the
              # signed manifest (collect would otherwise drop it).
              node scripts/release/release-image-manifest.mjs collect \
                --directory release-image-metadata \
                --source-commit "$SOURCE_COMMIT" \
                --release-kind server-only \
                --carried-source-commit "$BINARIES_SHA" \
                --carried-output carried-images.json \
                --output release-images.json
              ;;
            *)
              echo "::error::unknown release kind '$RELEASE_KIND'"
              exit 1
              ;;
          esac

      - name: Prepare release assets
        env:
          # Empty when Windows signing was skipped; the manifest then simply
          # omits the field rather than asserting a provider that never ran.
          WINDOWS_SIGNING_PROVIDER_USED: ${{ needs.sign-windows-tauri.outputs.provider }}
        run: |
          case "$RELEASE_KIND" in
            full|server-only) ;;
            *) echo "::error::unknown release kind '$RELEASE_KIND'" >&2; exit 1 ;;
          esac
          mkdir -p release-assets

          # Copy agent binaries
          for dir in artifacts/breeze-agent-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy backup binaries
          for dir in artifacts/breeze-backup-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy desktop-helper binaries
          for dir in artifacts/breeze-desktop-helper-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy user-helper binaries (Windows-only sibling of the agent that
          # runs in interactive user sessions). See #816.
          for dir in artifacts/breeze-user-helper-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy watchdog binaries
          for dir in artifacts/breeze-watchdog-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy viewer installers
          for dir in artifacts/breeze-viewer-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy recovery media (W04b). arm64 is continue-on-error in
          # build-recovery-media, so its artifact may legitimately be
          # missing — only amd64 is required.
          for dir in artifacts/breeze-recovery-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done
          # A server-only release ships no recovery media (the base release's
          # ISO stays current); a full release must.
          if [ "$RELEASE_KIND" = "full" ] && [ ! -f release-assets/breeze-recovery-linux-amd64.iso ]; then
            echo "missing required release asset: breeze-recovery-linux-amd64.iso" >&2
            exit 1
          fi

          # Copy viewer update manifest
          if [ -d "artifacts/viewer-latest-json" ] && [ -f "artifacts/viewer-latest-json/latest.json" ]; then
            cp artifacts/viewer-latest-json/latest.json release-assets/latest.json
          fi

          # Copy helper installers
          for dir in artifacts/breeze-helper-*; do
            if [ -d "$dir" ] && ls "$dir"/* >/dev/null 2>&1; then
              cp "$dir"/* release-assets/
            fi
          done

          # Copy macOS installer app
          if [ -d "artifacts/breeze-installer-app" ] && ls "artifacts/breeze-installer-app/"* >/dev/null 2>&1; then
            cp "artifacts/breeze-installer-app/"* release-assets/
          fi

          # Create archives for API and Web
          if [ -d "artifacts/api-dist" ]; then
            tar -czvf release-assets/breeze-api.tar.gz -C artifacts/api-dist .
          fi

          if [ -d "artifacts/web-dist" ]; then
            tar -czvf release-assets/breeze-web.tar.gz -C artifacts/web-dist .
          fi

          SOURCE_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          export SOURCE_COMMIT

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          release_dir = Path("release-assets")
          excluded = {
              "checksums.txt",
              "release-artifact-manifest.json",
              "release-artifact-manifest.json.ed25519",
              "release-artifact-manifest.json.minisig",
          }

          # Raw Mach-O agent binaries get Developer ID + notarization but
          # ship to users only inside the .pkg. spctl --assess --type execute
          # is invalid against raw Mach-O, so the trust label is correct
          # even though the end-user verifier differs (.pkg gatekeeper check).
          DARWIN_BINARY_RE = re.compile(
              r"^breeze-(agent|backup|desktop-helper|watchdog)-darwin-(amd64|arm64)$"
          )

          # BYO signing (Deliverable 1): unsigned build outputs published as
          # inputs for self-hosters to sign with their own certificates. The
          # -unsigned rule MUST be evaluated before the extension branches —
          # breeze-agent-windows-amd64-unsigned.exe would otherwise classify
          # as windows-authenticode-required.
          UNSIGNED_INPUT_RE = re.compile(
              r"^breeze-(agent|backup|watchdog|user-helper)-windows-amd64-unsigned\.exe$"
              r"|^breeze-(agent|backup|desktop-helper|watchdog)-darwin-(amd64|arm64)-unsigned$"
          )

          def is_signing_input(name):
              return UNSIGNED_INPUT_RE.match(name) is not None

          # The public pipeline no longer Authenticode-signs any agent-family
          # Windows artifact (the exes or the MSI) — this is the self-host
          # edition, unsigned by construction. Evaluated before the generic
          # extension branches below, which would otherwise classify these as
          # windows-authenticode-required. Deliberately does NOT cover the
          # unrelated viewer/helper Tauri MSIs (breeze-viewer-windows.msi,
          # breeze-helper-windows.msi) — those are still Authenticode-signed
          # (sign-windows-tauri job, out of scope here) and keep that trust
          # level. breeze-agent-template.msi is not currently produced by
          # this workflow (removed by an earlier initiative); nothing to
          # classify.
          AGENT_FAMILY_WINDOWS_RE = re.compile(
              r"^breeze-agent\.msi$"
              r"|^breeze-(agent|backup|watchdog|user-helper)-windows-amd64\.exe$"
          )

          def is_agent_family_windows(name):
              return AGENT_FAMILY_WINDOWS_RE.match(name) is not None

          def platform_trust(name):
              if is_signing_input(name):
                  return "none"
              if is_agent_family_windows(name):
                  return "none"
              if name.endswith(".msi") or name.endswith(".exe"):
                  return "windows-authenticode-required"
              if (
                  name.endswith(".pkg")
                  or name.endswith(".app.zip")
                  or name.endswith(".dmg")
              ):
                  return "macos-developer-id-notarization-required"
              if DARWIN_BINARY_RE.match(name):
                  return "macos-developer-id-notarization-required"
              return "release-workflow-produced"

          windows_signing_provider = os.environ.get("WINDOWS_SIGNING_PROVIDER_USED", "").strip()
          if windows_signing_provider not in ("", "azure", "sslcom"):
              raise SystemExit(
                  f"unexpected Windows signing provider: {windows_signing_provider!r}"
              )

          release_kind = os.environ["RELEASE_KIND"]
          if release_kind not in ("full", "server-only"):
              raise SystemExit(f"unknown release kind: {release_kind!r}")

          pkg_attestation_path = Path("artifacts/macos-pkg-attestation/macos-pkg.tsv")
          # A server-only release builds no macOS package, so it has no
          # attestation; any .pkg that still appeared fails below for lack of one.
          if release_kind == "full" and not pkg_attestation_path.is_file():
              raise SystemExit(
                  "macOS package publisher attestation is missing — refusing to describe packages as trusted"
              )
          pkg_publishers = {}
          pkg_attestation_lines = (
              pkg_attestation_path.read_text(encoding="utf8").splitlines()
              if release_kind == "full"
              else []
          )
          for line in pkg_attestation_lines:
              fields = line.split("\t")
              if len(fields) != 4:
                  raise SystemExit(f"malformed macOS package publisher attestation: {line!r}")
              name, trust, signing_identity, signing_team_id = fields
              if name in pkg_publishers:
                  raise SystemExit(f"duplicate macOS package publisher attestation: {name}")
              if trust != "macos-developer-id-notarization-required":
                  raise SystemExit(f"unexpected macOS package trust attestation for {name}: {trust!r}")
              if not re.fullmatch(r"[A-Z0-9]{10}", signing_team_id):
                  raise SystemExit(f"invalid macOS package signing team ID for {name}")
              if not signing_identity.startswith("Developer ID Installer: ") or not signing_identity.endswith(
                  f" ({signing_team_id})"
              ):
                  raise SystemExit(f"invalid macOS package signing identity for {name}")
              pkg_publishers[name] = (signing_identity, signing_team_id)

          assets = []
          for path in sorted(release_dir.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.name in excluded:
                  continue
              entry = {
                  "name": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
                  "platformTrust": platform_trust(path.name),
                  # BYO signing (Deliverable 2): every asset this workflow
                  # produces is the self-host edition — hosted builds happen
                  # in a separate, private repository and never reach this
                  # manifest. See the guard step below for the corresponding
                  # non-regression check.
                  "edition": "self-host",
              }
              if is_signing_input(path.name):
                  entry["intendedUse"] = "signing-input"
              if path.name.endswith(".pkg"):
                  publisher = pkg_publishers.get(path.name)
                  if publisher is None:
                      raise SystemExit(
                          f"macOS package {path.name} has no publisher attestation"
                      )
                  entry["signingIdentity"], entry["signingTeamId"] = publisher
              # Which CA actually vouched for this artifact. Recorded only where
              # Authenticode is required, so a provider switch is auditable from
              # the signed manifest rather than only from workflow logs.
              if (
                  entry["platformTrust"] == "windows-authenticode-required"
                  and windows_signing_provider
              ):
                  entry["signingProvider"] = windows_signing_provider
              assets.append(entry)

          unexpected_pkg_attestations = sorted(set(pkg_publishers) - {a["name"] for a in assets})
          if unexpected_pkg_attestations:
              raise SystemExit(
                  "publisher attestations do not match release assets: "
                  f"{unexpected_pkg_attestations}"
              )
          with open("release-images.json") as image_fh:
              images = json.load(image_fh)

          manifest = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "release": os.environ["GITHUB_REF_NAME"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "releaseKind": release_kind,
              "assets": assets,
              "images": images,
          }
          # Server-only: flat top-level keys only. verify-release-images.sh
          # requires exactly one top-level "sourceCommit" line and parses
          # images[] by fixed indentation, so nothing is added inside images[].
          if release_kind == "server-only":
              with open("carried-images.json") as carried_fh:
                  carried_images = json.load(carried_fh)
              if not isinstance(carried_images, list) or not carried_images:
                  raise SystemExit("server-only release has no carried images")
              manifest["binariesRelease"] = os.environ["BINARIES_TAG"]
              manifest["binariesSourceCommit"] = os.environ["BINARIES_SHA"]
              manifest["carriedImages"] = carried_images
          (release_dir / "release-artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      # BYO signing (Deliverable 1) non-regression: the manifest must gain
      # sourceCommit and exactly the expected signing-input entries, and the
      # signed set's platform-trust classification must be unchanged. Runs
      # before the manifest is signed so a violation blocks the release.
      - name: Verify signing-input manifest entries
        if: startsWith(github.ref, 'refs/tags/') && env.RELEASE_KIND == 'full'
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          export SOURCE_COMMIT
          python3 <<'PY'
          import json
          import os
          import re

          with open("release-assets/release-artifact-manifest.json") as fh:
              manifest = json.load(fh)

          source_commit = manifest.get("sourceCommit")
          assert isinstance(source_commit, str) and re.fullmatch(r"[0-9a-f]{40}", source_commit), \
              f"sourceCommit missing or malformed: {source_commit!r}"
          assert source_commit == os.environ["SOURCE_COMMIT"], \
              f"sourceCommit {source_commit} != checked-out commit {os.environ['SOURCE_COMMIT']}"

          EXPECTED_UNSIGNED = {
              "breeze-agent-windows-amd64-unsigned.exe",
              "breeze-backup-windows-amd64-unsigned.exe",
              "breeze-watchdog-windows-amd64-unsigned.exe",
              "breeze-user-helper-windows-amd64-unsigned.exe",
              "breeze-agent-darwin-amd64-unsigned",
              "breeze-agent-darwin-arm64-unsigned",
              "breeze-backup-darwin-amd64-unsigned",
              "breeze-backup-darwin-arm64-unsigned",
              "breeze-desktop-helper-darwin-amd64-unsigned",
              "breeze-desktop-helper-darwin-arm64-unsigned",
              "breeze-watchdog-darwin-amd64-unsigned",
              "breeze-watchdog-darwin-arm64-unsigned",
          }
          # Canonical (non "-unsigned") agent-family Windows assets. Unlike
          # every other non-signing-input asset, these legitimately carry
          # platformTrust "none" — the public pipeline no longer
          # Authenticode-signs the agent family at all (Deliverable 2).
          AGENT_FAMILY_WINDOWS_UNSIGNED = {
              "breeze-agent.msi",
              "breeze-agent-windows-amd64.exe",
              "breeze-backup-windows-amd64.exe",
              "breeze-watchdog-windows-amd64.exe",
              "breeze-user-helper-windows-amd64.exe",
          }

          by_name = {a["name"]: a for a in manifest["assets"]}
          missing = EXPECTED_UNSIGNED - set(by_name)
          assert not missing, f"missing unsigned signing-input assets: {sorted(missing)}"
          for name in sorted(EXPECTED_UNSIGNED):
              entry = by_name[name]
              assert entry.get("platformTrust") == "none", \
                  f"{name}: platformTrust {entry.get('platformTrust')!r} != 'none'"
              assert entry.get("intendedUse") == "signing-input", \
                  f"{name}: intendedUse {entry.get('intendedUse')!r} != 'signing-input'"

          missing_agent_family = AGENT_FAMILY_WINDOWS_UNSIGNED - set(by_name)
          assert not missing_agent_family, \
              f"missing unsigned agent-family Windows assets: {sorted(missing_agent_family)}"
          for name in sorted(AGENT_FAMILY_WINDOWS_UNSIGNED):
              entry = by_name[name]
              assert entry.get("platformTrust") == "none", \
                  f"{name}: platformTrust {entry.get('platformTrust')!r} != 'none' (agent-family Windows assets must be unsigned in the public pipeline)"
              assert "intendedUse" not in entry, \
                  f"{name}: canonical agent-family asset must not carry intendedUse (that's reserved for the -unsigned signing-input copies)"

          for name, entry in by_name.items():
              if name in EXPECTED_UNSIGNED or name in AGENT_FAMILY_WINDOWS_UNSIGNED:
                  continue
              assert "-unsigned" not in name, \
                  f"unexpected -unsigned asset outside the expected set: {name}"
              assert "intendedUse" not in entry, \
                  f"{name}: signed-set asset must not carry intendedUse"
              assert entry.get("platformTrust") != "none", \
                  f"{name}: signed-set asset must not have platformTrust 'none'"

          # Every asset this workflow produces is the self-host edition —
          # hosted builds happen in a separate, private repository.
          for name, entry in by_name.items():
              assert entry.get("edition") == "self-host", \
                  f"{name}: edition {entry.get('edition')!r} != 'self-host'"

          # Gate against any hosted/signed agent artifact leaking into public
          # assets: no agent-family Windows asset may carry a signed/notarized
          # platformTrust. (Darwin agent binaries are intentionally out of
          # scope here — macOS Developer ID signing/notarization is a
          # separate, unchanged gate; see build-macos-agent.)
          FORBIDDEN_AGENT_TRUST = {
              "windows-authenticode-required",
              "macos-developer-id-notarization-required",
          }
          for name in AGENT_FAMILY_WINDOWS_UNSIGNED:
              entry = by_name[name]
              assert entry.get("platformTrust") not in FORBIDDEN_AGENT_TRUST, \
                  f"{name}: agent-family asset carries platformTrust {entry.get('platformTrust')!r} — a hosted/signed agent artifact may have leaked into the public release"

          # Signed-set spot checks, one per trust class (classification-order
          # non-regression for the extension branches).
          assert by_name["breeze-agent.msi"]["platformTrust"] == "none"
          assert by_name["breeze-agent-windows-amd64.exe"]["platformTrust"] == "none"
          assert by_name["breeze-agent-darwin-arm64"]["platformTrust"] == "macos-developer-id-notarization-required"
          assert by_name["breeze-agent-linux-amd64"]["platformTrust"] == "release-workflow-produced"
          assert by_name["breeze-viewer-windows.msi"]["platformTrust"] == "windows-authenticode-required"
          print(f"OK: {len(EXPECTED_UNSIGNED)} signing-input assets + {len(AGENT_FAMILY_WINDOWS_UNSIGNED)} unsigned agent-family Windows assets verified; sourceCommit={source_commit}")
          PY

      # Server-only counterpart of the check above: the base manifest is
      # re-downloaded and verified here rather than trusted from an artifact.
      - name: Verify base release manifest
        if: startsWith(github.ref, 'refs/tags/') && env.RELEASE_KIND == 'server-only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS: ${{ secrets.RELEASE_MANIFEST_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/server-only-base"
          mkdir -p "$base_dir"
          gh release download "$BINARIES_TAG" --repo "$GITHUB_REPOSITORY" --dir "$base_dir" \
            --pattern release-artifact-manifest.json \
            --pattern release-artifact-manifest.json.ed25519
          node scripts/release/release-image-manifest.mjs verify \
            --manifest "$base_dir/release-artifact-manifest.json" \
            --signature "$base_dir/release-artifact-manifest.json.ed25519" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-release "$BINARIES_TAG" \
            --require-kind full \
            --output "$base_dir/identity.json"

      # Asset allowlist for a server-only release. Runs before signing, so a
      # binary artifact that slipped in blocks the release instead of shipping.
      - name: Verify server-only release assets
        if: startsWith(github.ref, 'refs/tags/') && env.RELEASE_KIND == 'server-only'
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          export SOURCE_COMMIT
          BASE_IDENTITY="$RUNNER_TEMP/server-only-base/identity.json"
          export BASE_IDENTITY
          python3 <<'PY'
          import json
          import os
          import re

          with open("release-assets/release-artifact-manifest.json") as fh:
              manifest = json.load(fh)
          with open(os.environ["BASE_IDENTITY"]) as fh:
              base = json.load(fh)

          assert manifest.get("sourceCommit") == os.environ["SOURCE_COMMIT"], \
              f"sourceCommit {manifest.get('sourceCommit')!r} != checked-out commit"
          assert manifest.get("releaseKind") == "server-only", \
              f"releaseKind {manifest.get('releaseKind')!r} != 'server-only'"
          assert manifest.get("binariesRelease") == os.environ["BINARIES_TAG"], \
              f"binariesRelease {manifest.get('binariesRelease')!r} != {os.environ['BINARIES_TAG']!r}"
          assert manifest.get("binariesSourceCommit") == os.environ["BINARIES_SHA"], \
              "binariesSourceCommit does not match the base release commit"

          ALLOWED = {"breeze-api.tar.gz", "breeze-web.tar.gz", "latest.json"}
          REQUIRED = {"breeze-api.tar.gz", "breeze-web.tar.gz"}
          BINARY_NAME_RE = re.compile(
              r"-unsigned"
              r"|^breeze-(agent|backup|watchdog|user-helper|desktop-helper|viewer|helper|recovery)"
              r"|\.(msi|pkg|dmg|iso|exe|AppImage)$"
              r"|installer"
          )
          by_name = {a["name"]: a for a in manifest["assets"]}
          assert len(by_name) == len(manifest["assets"]), "duplicate asset names"
          for name, entry in by_name.items():
              assert not BINARY_NAME_RE.search(name), f"binary asset {name} in a server-only release"
              assert name in ALLOWED, f"unexpected asset {name} in a server-only release"
              assert entry.get("platformTrust") == "release-workflow-produced", \
                  f"{name}: platformTrust {entry.get('platformTrust')!r}"
              assert "intendedUse" not in entry, f"{name}: server-only assets are never signing inputs"
          missing = REQUIRED - set(by_name)
          assert not missing, f"missing server assets: {sorted(missing)}"

          # latest.json must be the base release's file, byte for byte, so
          # Viewer clients see no update and still download from the base.
          base_latest = [a for a in base.get("assets", []) if a.get("name") == "latest.json"]
          if "latest.json" in by_name or base_latest:
              assert len(base_latest) == 1 and "latest.json" in by_name, \
                  "latest.json must be carried exactly when the base release has one"
              ours = by_name["latest.json"]
              assert ours["sha256"] == base_latest[0]["sha256"] and ours["size"] == base_latest[0]["size"], \
                  "latest.json is not byte-identical to the base release's"

          images = {(i["name"], i["repository"], i["digest"]) for i in manifest["images"]}
          carried = manifest.get("carriedImages")
          assert isinstance(carried, list) and [c.get("name") for c in carried] == ["binaries"], \
              "carriedImages must list exactly the binaries image"
          for entry in carried:
              assert (entry["name"], entry["repository"], entry["digest"]) in images, \
                  f"carried {entry['name']} does not match images[]"
              assert entry.get("fromRelease") == manifest["binariesRelease"], "carried fromRelease mismatch"
              assert entry.get("fromSourceCommit") == manifest["binariesSourceCommit"], "carried fromSourceCommit mismatch"
          base_binaries = [i for i in base.get("images", []) if i.get("name") == "binaries"]
          assert len(base_binaries) == 1 and (
              base_binaries[0]["repository"], base_binaries[0]["digest"]
          ) == (carried[0]["repository"], carried[0]["digest"]), \
              "the carried binaries digest is not the base release's signed binaries digest"
          print(f"OK: server-only release; {sorted(by_name)}; binaries carried from {manifest['binariesRelease']}")
          PY

      - name: Sign release artifact manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_MANIFEST_MINISIGN_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_MINISIGN_PRIVATE_KEY }}
          RELEASE_MANIFEST_MINISIGN_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_MINISIGN_PUBLIC_KEY }}
          RELEASE_MANIFEST_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_ED25519_PRIVATE_KEY }}
          RELEASE_MANIFEST_ED25519_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_MANIFEST_MINISIGN_PRIVATE_KEY" ] || [ -z "$RELEASE_MANIFEST_MINISIGN_PUBLIC_KEY" ]; then
            echo "::error::RELEASE_MANIFEST_MINISIGN_PRIVATE_KEY and RELEASE_MANIFEST_MINISIGN_PUBLIC_KEY are required for tag releases."
            exit 1
          fi
          if [ -z "$RELEASE_MANIFEST_ED25519_PRIVATE_KEY" ] || [ -z "$RELEASE_MANIFEST_ED25519_PUBLIC_KEY" ]; then
            echo "::error::RELEASE_MANIFEST_ED25519_PRIVATE_KEY and RELEASE_MANIFEST_ED25519_PUBLIC_KEY are required for tag releases."
            exit 1
          fi

          # Harden against a degraded Azure apt mirror (same flake as #1605).
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to install minisign after 3 attempts."
              exit 1
            fi
            echo "::warning::apt install failed (attempt ${attempt}/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

          key_file="$RUNNER_TEMP/release-manifest.minisign.key"
          printf '%s' "$RELEASE_MANIFEST_MINISIGN_PRIVATE_KEY" > "$key_file"
          unset RELEASE_MANIFEST_MINISIGN_PRIVATE_KEY
          chmod 600 "$key_file"

          minisign -S \
            -s "$key_file" \
            -m release-assets/release-artifact-manifest.json \
            -x release-assets/release-artifact-manifest.json.minisig \
            -t "Breeze release artifact manifest ${GITHUB_REF_NAME}"

          minisign -V \
            -P "$RELEASE_MANIFEST_MINISIGN_PUBLIC_KEY" \
            -m release-assets/release-artifact-manifest.json \
            -x release-assets/release-artifact-manifest.json.minisig

          node <<'NODE'
          const { createPrivateKey, createPublicKey, sign, verify } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');

          const spkiPrefix = Buffer.from('302a300506032b6570032100', 'hex');

          function parsePrivateKey(value) {
            const trimmed = value.trim();
            if (trimmed.includes('BEGIN PRIVATE KEY')) {
              return createPrivateKey(trimmed);
            }
            return createPrivateKey({
              key: Buffer.from(trimmed, 'base64'),
              format: 'der',
              type: 'pkcs8',
            });
          }

          function parsePublicKey(value) {
            const trimmed = value.trim();
            if (trimmed.includes('BEGIN PUBLIC KEY')) {
              return createPublicKey(trimmed);
            }
            const decoded = Buffer.from(trimmed, 'base64');
            if (decoded.length === 32) {
              return createPublicKey({
                key: Buffer.concat([spkiPrefix, decoded]),
                format: 'der',
                type: 'spki',
              });
            }
            return createPublicKey({ key: decoded, format: 'der', type: 'spki' });
          }

          const manifest = readFileSync('release-assets/release-artifact-manifest.json');
          const privateKey = parsePrivateKey(process.env.RELEASE_MANIFEST_ED25519_PRIVATE_KEY);
          const publicKey = parsePublicKey(process.env.RELEASE_MANIFEST_ED25519_PUBLIC_KEY);
          const signature = sign(null, manifest, privateKey);
          if (!verify(null, manifest, publicKey, signature)) {
            throw new Error('Ed25519 release manifest signature self-verification failed');
          }
          writeFileSync(
            'release-assets/release-artifact-manifest.json.ed25519',
            `${signature.toString('base64')}\n`,
            { mode: 0o644 }
          );
          NODE

      - name: Generate release checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Upload signed release image manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-image-manifest
          path: |
            release-assets/release-artifact-manifest.json
            release-assets/release-artifact-manifest.json.ed25519
          retention-days: 90

      - name: Verify release asset integrity requirements
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # checksums.txt is verified for existence/non-emptiness but cannot
          # contain a SHA entry for itself: `sha256sum * > checksums.txt`
          # expands the glob before creating the redirection target.
          if [ ! -s "release-assets/checksums.txt" ]; then
            echo "::error::Required asset missing or empty: checksums.txt"
            exit 1
          fi

          # Build the asset list dynamically from release-assets/ to catch
          # partial-upload failures (missing AppImage, DMG, signature, etc.)
          # that a hand-curated list silently allows.
          # ! -name '.*' mirrors `sha256sum *`'s glob (which excludes dotfiles)
          # so the two steps see the same file set. Materialize via a tempfile
          # so a `find` failure propagates under set -e (process substitution
          # exit codes don't reach the parent shell).
          assets_list=$(mktemp)
          trap 'rm -f "$assets_list"' EXIT
          find release-assets -mindepth 1 -maxdepth 1 -type f ! -name '.*' -print0 \
            > "$assets_list"

          asset_count=0
          while IFS= read -r -d '' path; do
            asset=$(basename "$path")
            [ "$asset" = "checksums.txt" ] && continue
            asset_count=$((asset_count + 1))
            if [ ! -s "$path" ]; then
              echo "::error::Required signed/notarized release asset missing or empty: $asset"
              exit 1
            fi
            if ! awk -v asset="$asset" '
              $1 ~ /^[a-f0-9]{64}$/ {
                name=$0
                sub(/^[a-f0-9]{64}[[:space:]]+[*]?/, "", name)
                if (name == asset) found=1
              }
              END { exit found ? 0 : 1 }
            ' release-assets/checksums.txt; then
              echo "::error::checksums.txt missing SHA-256 entry for $asset"
              exit 1
            fi
          done < "$assets_list"

          if [ "$asset_count" -eq 0 ]; then
            echo "::error::No signable artifacts found in release-assets/ (only checksums.txt or empty)"
            exit 1
          fi
          echo "Verified $asset_count release assets against checksums.txt"

      - name: Write server-only release banner
        if: env.RELEASE_KIND == 'server-only'
        run: |
          set -euo pipefail
          node - server-only-classification/server-only-classification.json release-banner.md <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const [reportPath, bannerPath] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const { BINARIES_TAG: base, GITHUB_REPOSITORY: repository, GITHUB_SERVER_URL: server, GITHUB_REF_NAME: tag } = process.env;
          if (report.tag !== tag || report.base !== base) throw new Error('classification report does not match this release');
          const baseUrl = `${server}/${repository}/releases/tag/${base}`;
          const agentFacing = report.agentFacing.length
            ? report.agentFacing.map((path) => `- \`${path}\``).join('\n')
            : 'none';
          writeFileSync(bannerPath, [
            `> **Server-only release.** Server code only (API, web, portal, M365 executors). Agent, Viewer, Helper, installers and recovery media are unchanged from **${base}** — download them from [${base}](${baseUrl}).`,
            '> No agent update; no fleet change.',
            '',
            `**Agent-facing server changes** (reviewed for compatibility with ${base} agents):`,
            '',
            agentFacing,
            '',
          ].join('\n'));
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
          # Server-only releases prepend a banner naming the base release; full
          # releases pass no body, exactly as before.
          body_path: ${{ env.RELEASE_KIND == 'server-only' && 'release-banner.md' || '' }}
          # RELEASE_DRAFT_FIRST (repo variable, normally unset): when 'true',
          # the release is created as a DRAFT so downstream consumers (self-host
          # servers syncing published releases) see nothing until it is
          # explicitly published — used when a release must be verified and
          # coordinated with out-of-band deployment steps before going live.
          # Publish only through the guarded release-promotion.yml workflow;
          # see docs/runbooks/2026-08-29-release-lineage-promotion.md.
          # Server-only releases are always drafts: release-promotion.yml
          # revalidates the ledger row before publishing them.
          draft: ${{ needs.validate-release-lineage.outputs.channel == 'candidate' || vars.RELEASE_DRAFT_FIRST == 'true' || needs.classify-release.outputs.release_kind == 'server-only' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries-image:
    name: Build & Push Binaries Init Image
    runs-on: ubuntu-latest
    needs: [build-agent, build-macos-agent, sign-windows-tauri, build-viewer, build-helper, build-viewer-macos, build-helper-macos, classify-release]
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.classify-release.outputs.release_kind == 'full'
      && needs.build-agent.result == 'success'
      && (needs.build-macos-agent.result == 'success' || needs.build-macos-agent.result == 'skipped')
      && (needs.sign-windows-tauri.result == 'success' || needs.sign-windows-tauri.result == 'skipped')
      && needs.build-viewer.result == 'success'
      && needs.build-helper.result == 'success'
      && (needs.build-viewer-macos.result == 'success' || needs.build-viewer-macos.result == 'skipped')
      && (needs.build-helper-macos.result == 'success' || needs.build-helper-macos.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create staging directory
        run: mkdir -p staging/agent staging/viewer staging/helper

      - name: Download agent artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: staging/agent
          pattern: 'breeze-agent-*'
          merge-multiple: true

      - name: Download viewer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: staging/viewer
          pattern: 'breeze-viewer-*'
          merge-multiple: true

      - name: Download helper artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: staging/helper
          pattern: 'breeze-helper-*'
          merge-multiple: true

      # BYO signing (Deliverable 1): -unsigned signing inputs are published
      # release assets only. Keep them out of the binaries-init image — the
      # API's local scanner would ignore them (parseBinaryFilename anchors on
      # breeze-<component>-<os>-<arch>[.exe]) but they'd bloat the image and
      # the /target volume for nothing.
      - name: Drop unsigned signing-input files from image staging
        run: |
          set -euo pipefail
          find staging -type f -name '*-unsigned*' -print -delete

      - name: Write VERSION file
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "${REF_NAME#v}" > staging/VERSION

      - name: List staging contents
        run: find staging -type f | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image base
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE_BASE=${BASE,,}" >> "$GITHUB_ENV"

      - name: Build and push unadvertised binaries digest
        id: push-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: staging/
          file: docker/Dockerfile.binaries
          outputs: type=image,name=${{ env.IMAGE_BASE }}/binaries,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-binaries
          cache-to: type=gha,mode=max,scope=server-binaries

      - name: Record signed-manifest input
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          node scripts/release/release-image-manifest.mjs record \
            --name binaries --repository "${IMAGE_BASE}/binaries" \
            --digest "$IMAGE_DIGEST" --source-commit "$GITHUB_SHA" \
            --output binaries.json

      - name: Upload binaries image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-binaries
          path: binaries.json
          retention-days: 90

  build-docker-api:
    name: Build & Push API Docker Image
    runs-on: ubuntu-latest
    needs: [build-api, classify-release]
    # classify-release succeeds for every full release, build-only dispatch
    # included; when it fails there is no release kind to bake.
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.build-api.result == 'success'
      && needs.classify-release.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download API artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: api-dist
          path: ${{ runner.temp }}/release-dist/apps/api/dist

      - name: Download built-in workspace web bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: api-workspace-dist
          path: ${{ runner.temp }}/release-dist/ee/workspace/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image base
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE_BASE=${BASE,,}" >> "$GITHUB_ENV"

      - name: Build and push unadvertised API digest
        id: push-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/api/Dockerfile
          build-contexts: |
            release-dist=${{ runner.temp }}/release-dist
          outputs: type=image,name=${{ env.IMAGE_BASE }}/api,push-by-digest=true,name-canonical=true,push=true
          # A server-only image pairs with its base release's binaries
          # (binarySource.getPairedBinariesVersion). Full releases pass no
          # BREEZE_BINARIES_VERSION build-arg at all, so their image is
          # unchanged. Never set it through compose.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ needs.classify-release.outputs.release_kind == 'server-only' && format('BREEZE_BINARIES_VERSION={0}', needs.classify-release.outputs.binaries_version) || '' }}
          cache-from: |
            type=gha,scope=server-api-build
            type=gha,scope=server-api
          cache-to: type=gha,mode=max,scope=server-api

      - name: Record signed-manifest input
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          node scripts/release/release-image-manifest.mjs record \
            --name api --repository "${IMAGE_BASE}/api" \
            --digest "$IMAGE_DIGEST" --source-commit "$GITHUB_SHA" \
            --output api.json

      - name: Upload API image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-api
          path: api.json
          retention-days: 90

  build-docker-m365-graph-read-executor:
    name: Build & Push M365 Graph Read Executor Image
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
    permissions:
      contents: read
      packages: write
    outputs:
      executor-image-digest: ${{ steps.push-executor-digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMAGE_NAME is ${{ github.repository }} (e.g. LanternOps/breeze), but a
      # container reference must be lowercase. The api/web jobs launder this
      # through docker/metadata-action (which lowercases); this job builds the
      # ref by hand, so lowercase it explicitly.
      - name: Compute lowercase image base
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE_BASE=${BASE,,}" >> "$GITHUB_ENV"

      # Push by digest only: no release-facing tag exists until this exact
      # manifest passes the blocking vulnerability scan below.
      - name: Build and push unadvertised executor digest
        id: push-executor-digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/m365-graph-read-executor/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_BASE }}/m365-graph-read-executor,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-m365-graph-read-executor
          cache-to: type=gha,mode=max,scope=server-m365-graph-read-executor

      - name: Scan exact executor digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/m365-graph-read-executor@${{ steps.push-executor-digest.outputs.digest }}
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

      - name: Record executor digest
        env:
          EXECUTOR_IMAGE_DIGEST: ${{ steps.push-executor-digest.outputs.digest }}
        run: |
          node scripts/release/release-image-manifest.mjs record \
            --name m365-graph-read-executor \
            --repository "${IMAGE_BASE}/m365-graph-read-executor" \
            --digest "$EXECUTOR_IMAGE_DIGEST" --source-commit "$GITHUB_SHA" \
            --output m365-graph-read-executor.json

      - name: Upload executor digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-m365-graph-read-executor
          path: m365-graph-read-executor.json
          retention-days: 90

  build-docker-m365-graph-actions-executor:
    name: Build & Push M365 Graph Actions Executor Image
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
    permissions:
