name: CI cache seed

# GitHub Actions caches are ref-scoped: a run can restore caches saved on its
# own ref or the default branch, never from another PR or from merge-queue refs,
# and every cache a PR or queue ref saves only evicts main's (the repo sat at
# 15.7 GB against a 10 GB limit). So ci.yml and its composites only RESTORE;
# this workflow, running on main, is the single place that SAVES (#10744).
# Every key and path below must match what ci.yml / the composites restore;
# .github/scripts/ci-cache-policy.test.mjs enforces it.
#
# Entries unused for 7 days are evicted, so the daily schedule also restores
# each entry (which counts as a use) and only re-warms on a miss. Trigger by
# hand with:
#   gh workflow run "CI cache seed" --ref main
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - agent/go.sum
      - agent/go.mod
      - .github/tauri-apt-packages.txt
      - .github/scripts/tauri-apt.sh
      - docker/**
      - .github/actions/**
      - .github/workflows/ci-cache-seed.yml
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cache-seed
  cancel-in-progress: false

env:
  PNPM_VERSION: '10.34.5'
  GO_VERSION: '1.26.10'

jobs:
  seed-pnpm:
    name: Seed pnpm cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Resolve pnpm store path
        id: pnpm
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Warm pnpm store
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::pnpm install failed (attempt ${attempt}/${attempts}); retrying"
            sleep $((attempt * 20))
          done
          echo "::error::pnpm install failed after ${attempts} attempts."
          exit 1

      - name: Save pnpm cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  seed-go:
    name: Seed Go cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve Go cache dirs
        id: go
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.gomodcache }}
            ${{ steps.go.outputs.gocache }}
          key: go-${{ runner.os }}-${{ hashFiles('agent/go.sum', 'agent/go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Warm Go caches
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: agent
        run: |
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            if go mod download; then
              break
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "::error::go mod download failed after ${attempts} attempts."
              exit 1
            fi
            echo "::warning::go mod download failed (attempt ${attempt}/${attempts}); retrying"
            sleep $((attempt * 20))
          done
          # Mirror what CI compiles so the build cache is warm for its jobs:
          # test-agent-race (CGO_ENABLED=1 go test -race), test-agent and the
          # Windows jobs (CGO_ENABLED=0). `-run '^$'` compiles test binaries
          # without running them. Compiling is what fills GOCACHE, so no
          # `go vet` (Windows vet has baselined unsafeptr findings — see
          # scripts/check-windows-vet.sh — so it would fail every Windows run).
          # Each compile is non-fatal: a partial warm still saves, and a
          # package that fails here fails the same way in CI. `go mod
          # download` above stays fatal so a transient fetch error leaves the
          # key unsaved for the next run instead of saving a hollow cache.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export CGO_ENABLED=0
            go build ./... || echo "::warning::go build ./... failed; saving a partial Go cache"
            go test -count=1 -run '^$' ./... || echo "::warning::go test compile failed; saving a partial Go cache"
          else
            go build ./... || echo "::warning::go build ./... failed; saving a partial Go cache"
            CGO_ENABLED=1 go test -race -count=1 -run '^$' ./... || echo "::warning::go test -race compile failed; saving a partial Go cache"
            CGO_ENABLED=0 go test -count=1 -run '^$' ./... || echo "::warning::go test (CGO_ENABLED=0) compile failed; saving a partial Go cache"
          fi

      - name: Save Go cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.gomodcache }}
            ${{ steps.go.outputs.gocache }}
          key: go-${{ runner.os }}-${{ hashFiles('agent/go.sum', 'agent/go.mod') }}

  seed-golangci-lint:
    name: Seed golangci-lint binary cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore golangci-lint binary
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.12.2-${{ runner.os }}

      # Keep the version in lockstep with ci.yml's lint-agent job; the key
      # carries it, so a bump there needs the same bump here and in the key.
      - name: Install golangci-lint
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            if go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2; then
              echo "golangci-lint installed (attempt ${attempt})."
              exit 0
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "::error::golangci-lint install failed after ${attempts} attempts."
              exit 1
            fi
            echo "::warning::golangci-lint install failed (attempt ${attempt}/${attempts}); retrying"
            sleep $((attempt * 15))
          done

      - name: Save golangci-lint binary
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.12.2-${{ runner.os }}

  seed-tauri-apt:
    name: Seed Tauri apt cache
    # Same label as rust-check in ci.yml (the policy test pins it), so a closure is
    # never saved under an ImageOS the job does not run on.
    runs-on: ubuntu-26.04
    # Only a slow runner on the first seed of a package list needs this: it can
    # download the whole closure at tens of kB/s. See `fetch`.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write # Prune superseded closures below.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve runner image for apt cache key
        id: image
        shell: bash
        run: echo "id=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # Resolves against an empty dpkg status, so the closure does not depend on
      # what this runner's image happens to carry (#9847). The id hashes every
      # package version: an archive update makes a new entry on the next run.
      - name: Resolve Tauri apt closure
        id: plan
        shell: bash
        run: |
          work=$(mktemp -d)
          closure=$(bash .github/scripts/tauri-apt.sh plan "${work}")
          echo "work=${work}" >> "$GITHUB_OUTPUT"
          echo "closure=${closure}" >> "$GITHUB_OUTPUT"

      # The composite only restores. A hit counts as a use, which keeps the entry
      # from being evicted; the explicit save below recomputes its key, so the two
      # must stay identical (the policy test pins key and path).
      - name: Restore Tauri apt cache
        id: cache
        uses: ./.github/actions/tauri-apt-cache
        with:
          closure: ${{ steps.plan.outputs.closure }}

      - name: Download Tauri system dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TAURI_APT_WORK: ${{ steps.plan.outputs.work }}
          TAURI_DEBS_DIR: ${{ steps.cache.outputs.dir }}
        run: bash .github/scripts/tauri-apt.sh fetch "${TAURI_APT_WORK}" "${TAURI_DEBS_DIR}"

      # Keys are immutable: do not save a closure this runner cannot plan from
      # offline. `fetch` has already checked every .deb against its index hash.
      - name: Verify the closure installs without the network
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TAURI_DEBS_DIR: ${{ steps.cache.outputs.dir }}
        run: bash .github/scripts/tauri-apt.sh probe "${TAURI_DEBS_DIR}"

      - name: Save Tauri apt cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tauri-debs
          key: tauri-apt-${{ steps.image.outputs.id }}-${{ hashFiles('.github/tauri-apt-packages.txt') }}-${{ steps.plan.outputs.closure }}

      # A closure is a few hundred MB and archive updates make a new one, while the
      # repo's caches sit at the 10 GB limit (where GitHub evicts the oldest entries
      # of ANY kind). Keep the new closure and the one before it, which jobs already
      # running may still be restoring. Losing this race or this step costs nothing
      # but space, so it never fails the seed.
      - name: Prune superseded Tauri apt closures
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_PREFIX: tauri-apt-${{ steps.image.outputs.id }}-${{ hashFiles('.github/tauri-apt-packages.txt') }}-
        run: |
          gh cache list --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" --key "${CLOSURE_PREFIX}" \
            --sort created_at --order desc --limit 50 --json key --jq '.[2:][].key' \
            | while IFS= read -r key; do
                gh cache delete "${key}" --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" \
                  || echo "::warning::could not delete cache ${key}"
              done

  # Buildkit layer caches (type=gha) are scoped like every other cache, so PR
  # builds read what main exports here. Builds mirror ci.yml's, no push.
  seed-smoke-images:
    name: Seed smoke image layers (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile.api
            build-args: ''
          - image: web
            dockerfile: docker/Dockerfile.web
            build-args: PUBLIC_API_URL=
          - image: portal
            dockerfile: apps/portal/Dockerfile
            build-args: |
              PORTAL_BASE_PATH=/portal
              PUBLIC_API_URL=
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build smoke image and export layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=ci-smoke-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-smoke-${{ matrix.image }}

  seed-workspace-runtime:
    name: Seed workspace runtime layers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build analysis runtime and export layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/ai-workspace
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=workspace-runtime
          cache-to: type=gha,mode=max,scope=workspace-runtime
