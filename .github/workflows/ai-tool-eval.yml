name: AI Tool Eval

# Non-blocking by construction: runs on a schedule and on demand, never on
# pull_request (it needs a secret, and pr-workflow-must-be-secret-free forbids
# that), and reports only as an artifact + job summary.
on:
  workflow_dispatch:
    inputs:
      model: { description: 'Model id (default: resolveDefaultModel())', required: false, default: '' }
      tool_search: { description: 'default | on | off', required: false, default: 'default' }
      surface: { description: 'chat | helper-standard | …', required: false, default: 'chat' }
  schedule:
    - cron: '15 5 * * 1'   # Mondays 05:15 UTC

permissions:
  contents: read

env:
  PNPM_VERSION: '10.34.5'

jobs:
  tool-eval:
    name: Golden tool-selection eval (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.AI_TOOL_EVAL_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run eval
        if: env.HAS_KEY == 'true'
        env:
          AI_TOOL_EVAL_KEY: ${{ secrets.AI_TOOL_EVAL_KEY }}
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          EVAL_SURFACE: ${{ github.event.inputs.surface || 'chat' }}
          EVAL_TOOL_SEARCH: ${{ github.event.inputs.tool_search || 'default' }}
          EVAL_MODEL: ${{ github.event.inputs.model || '' }}
        run: |
          model_args=()
          if [ -n "$EVAL_MODEL" ]; then
            model_args=(--model "$EVAL_MODEL")
          fi
          pnpm --filter @breeze/api ai:tool-eval -- \
            --surface "$EVAL_SURFACE" \
            --tool-search "$EVAL_TOOL_SEARCH" \
            "${model_args[@]}" \
            --out "$GITHUB_WORKSPACE/tool-eval-report.json" \
            --summary-md "$GITHUB_WORKSPACE/tool-eval-summary.md"
          cat "$GITHUB_WORKSPACE/tool-eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain skip
        if: env.HAS_KEY != 'true'
        run: echo "AI_TOOL_EVAL_KEY is not set; eval skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-tool-eval-${{ github.run_id }}
          path: |
            tool-eval-report.json
            tool-eval-summary.md
          if-no-files-found: ignore
          retention-days: 90
