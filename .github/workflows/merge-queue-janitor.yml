name: Merge Queue Janitor

# When the merge queue rebuilds (a bypass push to main, a dequeued entry ahead),
# GitHub deletes the temporary `gh-readonly-queue/main/pr-N-<sha>` ref but does
# NOT cancel the workflow runs that were started for it (#5190, #9800). Those
# runs sit in the runner queue ahead of the live groups and starve them.
#
# This job cancels any queued/in-progress merge_group run whose ref no longer
# exists (strictly a 404 on the ref lookup; any other API outcome cancels
# nothing). Logic + tests: .github/scripts/cancel-stale-merge-group-runs.mjs.
#
# Triggers: GitHub throttles `schedule` on busy repos (observed gaps of ~3h
# against a 10-minute cron), so the cron alone cannot protect the queue. The
# `merge_group` trigger runs the sweep every time the queue builds a new group,
# which is exactly when the previous groups have just been invalidated.

on:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: merge-queue-janitor
  cancel-in-progress: false

jobs:
  cancel-superseded:
    name: Cancel superseded merge-group runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sweep script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: .github/scripts/cancel-stale-merge-group-runs.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Cancel merge_group runs whose queue ref is gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/cancel-stale-merge-group-runs.mjs
