name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily (was weekly): this is where an advisory newly published against a
  # package already on main surfaces, since ci.yml's security-audit now blocks
  # only on advisories a change introduces (W1, #10744).
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.34.5'
  GO_VERSION: '1.26.10'

# Least-privilege default; the SARIF-uploading job opts into
# security-events: write per-job below.
permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    # Read-only: this job installs and scans the checked-out code (PR code on
    # pull_request runs). The tracking issue is written by npm-audit-issue.
    outputs:
      outcome: ${{ steps.audit.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install osv-scanner
        run: bash scripts/security/install-osv-scanner.sh

      # Full gate, no base comparison: on main every blocking advisory counts.
      - name: Run dependency audit
        id: audit
        run: bash scripts/security/check-npm-audit.sh --findings-json "${RUNNER_TEMP}/npm-audit/npm-audit.json"

      # For npm-audit-issue's finding table. npm-audit.json is absent when the
      # scan failed an integrity check (the gate then writes no document); the
      # outcome marker keeps the artifact non-empty, so the download in
      # npm-audit-issue always finds it (continue-on-error is not allowed in
      # this workflow — check-supply-chain-hardening.sh).
      - name: Stage findings document
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          mkdir -p "${RUNNER_TEMP}/npm-audit"
          printf '%s\n' "$AUDIT_OUTCOME" > "${RUNNER_TEMP}/npm-audit/outcome.txt"

      - name: Upload findings document
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-audit-findings
          path: ${{ runner.temp }}/npm-audit/
          if-no-files-found: error
          retention-days: 7

  # One open `security-advisory` issue titled "Dependency audit red on main"
  # while main's audit is red; closed on the next green push or scheduled run
  # (W1, #10744). Its own job so that `issues: write` never shares a token
  # with an install of checked-out code. Pattern copied from ci.yml's
  # main-red-alert: reads are retried, writes get one attempt (a retried write
  # that had actually landed would open a second issue) and self-heal on the
  # next run.
  npm-audit-issue:
    name: NPM Audit tracking issue
    runs-on: ubuntu-latest
    needs: [npm-audit]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    steps:
      # Only the table renderer, from main (this job never runs for a PR);
      # nothing is installed or built. Runs on the runner's Node.
      - name: Checkout the finding-table renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/new-findings.mjs
          sparse-checkout-cone-mode: false

      # Only a red audit needs the table.
      - name: Download findings document
        if: needs.npm-audit.outputs.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-audit-findings
          path: ${{ runner.temp }}/npm-audit

      - name: Open, update, or close the dependency audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.npm-audit.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TITLE: Dependency audit red on main
        run: |
          # NOTE: deliberately no `-e` — a notifier must not turn on an API
          # blip; every call is handled explicitly (see main-red-alert, #3692).
          set -uo pipefail

          # Progress to STDERR: this is called inside $(...).
          gh_read_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "gh read failed (attempt ${attempt}/3): $*" >&2
              # No sleep after the final attempt — there is no fourth.
              if [ "$attempt" -lt 3 ]; then
                sleep $(( attempt * 5 ))
              fi
            done
            return 1
          }

          gh label create security-advisory --repo "$GITHUB_REPOSITORY" \
            --color D93F0B --description "Dependency advisory affecting main" 2>/dev/null || true

          # "Could not read" is its own outcome, never "none found" — that
          # would open a second issue on every red run while the API is down.
          # Every matching open issue, one number per line (oldest first).
          if existing=$(gh_read_retry gh issue list --repo "$GITHUB_REPOSITORY" --label security-advisory --state open \
            --limit 100 --json number,title --jq "[.[] | select(.title == \"$TITLE\") | .number] | sort | .[]"); then
            :
          else
            echo "::error::Could not read security-advisory issues after 3 attempts; skipping reconciliation for this run."
            exit 0
          fi
          first="$(printf '%s\n' "$existing" | sed -n '1p')"

          short_sha="${SHA:0:8}"
          case "$OUTCOME" in
            success)
              # Close every matching issue, not just one: duplicates from an
              # earlier lost write would otherwise stay open forever.
              while IFS= read -r n; do
                [ -n "$n" ] || continue
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                  --comment "The dependency audit is green on main as of \`$short_sha\`: $RUN_URL" \
                  || echo "::error::Failed to close issue #$n; it will close on the next green run."
              done <<<"$existing"
              ;;
            failure)
              findings="${RUNNER_TEMP}/npm-audit/npm-audit.json"
              if [ -s "$findings" ] && table=$(node .github/scripts/new-findings.mjs --table "$findings"); then
                :
              else
                table="The audit failed before producing findings (scan integrity or tooling failure) — see the run log."
              fi
              body="The dependency audit (\`scripts/security/check-npm-audit.sh\`) is red on main as of \`${short_sha}\`: ${RUN_URL}

          ${table}

          Fix by upgrading the package, or add a reviewed, expiring entry to \`scripts/security/npm-audit-exceptions.json\` (its header states the bar). PRs are not blocked by an advisory already on main, only by advisories they introduce (ci.yml security-audit).

          Managed by the NPM Audit tracking issue job in security.yml: updated on every red push or daily run, closed on the next green one."
              if [ -n "$first" ]; then
                gh issue edit "$first" --repo "$GITHUB_REPOSITORY" --body "$body" \
                  || echo "::error::Failed to update issue #$first; it is still open, so the red state is tracked."
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --label security-advisory \
                  --title "$TITLE" --body "$body" \
                  || echo "::error::Failed to open the dependency audit issue — main's audit is red and untracked. Re-run this job once the API recovers."
              fi
              ;;
            *)
              echo "Audit step outcome is '$OUTCOME' (cancelled/skipped/unset) — no signal, doing nothing."
              ;;
          esac

  go-vuln:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Negative self-tests for the two guards below (#8283): a deleted pin or
      # an empty govulncheck scan must fail, not pass. Uses the runner's Node.
      - name: Self-test security guards
        run: node --test scripts/security/check-security-guards.test.mjs

      # Runs before Setup Go on purpose: this job only proves the toolchain it
      # was handed is clean, so a pin that drifts anywhere else (release.yml
      # builds the shipped binary) would scan one Go and ship another.
      - name: Check Go toolchain pins agree
        run: bash scripts/security/check-go-version-pins.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Allowlist wrapper: fails on any symbol-level finding not in
      # scripts/security/govulncheck-allowlist.txt (reviewed, unfixable-only
      # exceptions with code-level mitigations).
      - name: Run govulncheck
        run: bash scripts/security/run-govulncheck.sh

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit helper Cargo dependencies
        working-directory: apps/helper/src-tauri
        run: cargo audit --deny warnings

      - name: Audit viewer Cargo dependencies
        working-directory: apps/viewer/src-tauri
        run: cargo audit --deny warnings

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate Trivy filesystem SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          exit-code: '0'

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'

      - name: Generate Trivy filesystem SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'trivy-fs.cdx.json'
          exit-code: '0'

      - name: Upload Trivy filesystem SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trivy-fs-sbom
          path: trivy-fs.cdx.json
          retention-days: 30

      - name: Run blocking Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

  # Builds and scans every container image this repo publishes, using the SAME
  # Dockerfile the release lanes ship.
  #
  # This list used to be hand-maintained beside the publish list in release.yml,
  # and the two drifted: the job built the
  # `docker/Dockerfile.api|web` compose variants while release.yml shipped
  # `apps/api|web/Dockerfile`, so the two most widely deployed images in the
  # product were gated by nothing and shipped a known HIGH CVE
  # (issues #4273 / #4260). `apps/api/src/config/dockerfileImageScanCoverage.test.ts`
  # now derives the published set from those workflows and fails if anything
  # published is missing from the matrix below.
  trivy-image-scan:
    name: Trivy Image Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Published to GHCR by release.yml (emergency manual builds go
          # through `docker buildx` + a GHCR push from a maintainer machine
          # instead of a workflow) ---
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: portal
            dockerfile: apps/portal/Dockerfile
          - image: m365-graph-read-executor
            dockerfile: apps/m365-graph-read-executor/Dockerfile
          - image: m365-graph-actions-executor
            dockerfile: apps/m365-graph-actions-executor/Dockerfile
          - image: m365-communications-executor
            dockerfile: apps/m365-communications-executor/Dockerfile
          # --- Never published, but built from source by CI and by users ---
          # ci.yml's smoke test builds these via docker-compose.override.yml.ci,
          # and self-hosters build them via docker-compose.override.yml.local-build,
          # so they stay gated too.
          - image: api-compose
            dockerfile: docker/Dockerfile.api
          - image: web-compose
            dockerfile: docker/Dockerfile.web
          # --- Never published, but executes model-authored code, so it is
          # scanned anyway. Built from docker/ai-workspace, not the repo root.
          #
          # Debian base, not Alpine (glibc wheels are required for
          # pandas/numpy). `bookworm` carries dozens of HIGH/CRITICAL Debian
          # CVEs with no fix published yet (affected/will_not_fix/fix_deferred
          # upstream) — that's a property of the distro, not this image, and
          # blocking on it would make the job permanently red. The policy for
          # this image is "zero FIXABLE HIGH/CRITICAL findings": OS packages
          # with a real fix are picked up by `apt-get upgrade` in the
          # Dockerfile, and `ignore-unfixed` below silences everything else.
          # The remaining two Python findings (msgpack, setuptools) come from
          # files vendored inside pip itself in the upstream base image, not
          # from anything in requirements.lock, and have no available fix
          # from our side either — see docker/ai-workspace/.trivyignore for
          # the full explanation and the specific CVE IDs excluded there.
          # The Alpine sibling images (api-compose, web-compose, etc.) stay on
          # the strict `ignore-unfixed: false` default above.
          - image: ai-workspace
            dockerfile: docker/ai-workspace/Dockerfile
            context: docker/ai-workspace
            ignore-unfixed: true
            trivyignores: docker/ai-workspace/.trivyignore
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context || '.' }}
        run: docker build -f "$DOCKERFILE" -t "breeze-${IMAGE}:security-scan" "$CONTEXT"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'breeze-${{ matrix.image }}:security-scan'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: ${{ matrix.ignore-unfixed || false }}
          trivyignores: ${{ matrix.trivyignores || '' }}

  # Lints the workflow files themselves. actionlint catches real workflow
  # bugs (bad expressions, wrong action inputs, invalid syntax); shellcheck
  # integration is disabled because the existing style nits in release.yml
  # would make this job perma-red — red must mean "act now". zizmor audits
  # for security smells (template injection, unpinned third-party actions,
  # excessive permissions); pin policy + accepted findings live in
  # .github/zizmor.yml.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7; temporary resolver input; Task 2 pins it before push
        with:
          node-version-file: .node-version

      - name: Run workflow security policy
        run: |
          node --test \
            .github/scripts/check-workflow-security.test.mjs \
            .github/scripts/cancel-stale-merge-group-runs.test.mjs \
            scripts/security/pin-github-actions.test.mjs \
            scripts/release/attest-macos-pkg.test.mjs
          node .github/scripts/check-workflow-security.mjs

      - name: Install actionlint (pinned + checksum-verified)
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint -shellcheck=

      # selfhost-signing-template/ is the source of truth for the public
      # breeze-selfhost-signing template repo. Its own .github/workflows/ci.yml
      # is never loaded here (nested workflow directories are not scanned), so
      # without this the verifier that decides whether a self-hoster applies
      # their Authenticode/Apple certificate to downloaded bytes is only ever
      # tested in the CONSUMER's fork, after adoption.
      - name: Verify BYO-signing template (self-test + standalone actionlint)
        run: |
          set -euo pipefail
          node selfhost-signing-template/scripts/verify-manifest.test.mjs
          # Lint the template as the standalone repo it becomes: its local
          # reusable-workflow refs (./.github/workflows/sign-release.yml) only
          # resolve when the template directory IS the repo root.
          standalone="$(mktemp -d)"
          cp -R selfhost-signing-template/. "$standalone/"
          # actionlint locates the workflows directory via the git root.
          git -C "$standalone" init -q
          (cd "$standalone" && "$GITHUB_WORKSPACE/actionlint" -shellcheck=)
          rm -rf "$standalone"

      - name: Run zizmor
        run: pipx run zizmor==1.25.2 --no-progress --config .github/zizmor.yml --min-severity medium .github/workflows/
