name: CodeQL SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Not a required check (`CI Success` is), so a docs-only PR can skip it
    # without starving the merge queue. See ci.yml for why CI itself cannot.
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - docs/**
      - apps/docs/**
      - internal/**
  schedule:
    # Weekly re-scan of main picks up new queries shipped in the CodeQL
    # bundle even when nothing landed that day.
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow files themselves for script injection
        # (untrusted `${{ github.event.* }}` in `run:`) and unpinned/excessive
        # permissions. It is cheap and this repo has a dozen inline scripts.
        language: [javascript-typescript, go, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: agent/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Go agent for CodeQL
        if: matrix.language == 'go'
        working-directory: agent
        run: |
          go mod download
          CGO_ENABLED=0 go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
