          # asserts every required job's result is checked inside it.
          # Docs-only bypass, fail-closed: the code-job assertions are skipped ONLY
          # when the classifier succeeded AND reported the literal `false`. An
          # empty output (classifier failed, skipped, or printed nothing) falls
          # through to the assertions, where every skipped code job fails them.
          # docs-check is the mirror image: required unless `docs` is literally
          # `false`, so an empty output demands a docs-check that never ran.
          # The smoke jobs boot the whole stack, so they run when api, web OR portal
