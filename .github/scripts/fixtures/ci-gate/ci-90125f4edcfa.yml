          ADDINS_CHANGED: ${{ needs.changes.outputs.addins }}
          M365_CHANGED: ${{ needs.changes.outputs.m365 }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          DOCS_CHECK_RESULT: ${{ needs.docs-check.result }}
          WORKSPACE_RUNTIME_RESULT: ${{ needs.workspace-runtime.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RELEASE_LEDGER_RESULT: ${{ needs.release-ledger.result }}
          CHECK_MIGRATIONS_RESULT: ${{ needs.check-migrations.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_API_RESULT: ${{ needs.test-api.result }}
          TEST_M365_GRAPH_READ_EXECUTOR_RESULT: ${{ needs.test-m365-graph-read-executor.result }}
          TEST_M365_GRAPH_ACTIONS_EXECUTOR_RESULT: ${{ needs.test-m365-graph-actions-executor.result }}
