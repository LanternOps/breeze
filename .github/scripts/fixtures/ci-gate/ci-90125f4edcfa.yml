             { [[ "${M365_CHANGED}" == "true" ]] && [[ "${TEST_M365_GRAPH_ACTIONS_EXECUTOR_RESULT}" != "success" ]]; } || \
             { [[ "${M365_CHANGED}" != "true" ]] && [[ "${M365_CHANGED}" != "false" ]]; } || \
             { [[ "${M365_CHANGED}" == "false" ]] && [[ "${TEST_M365_GRAPH_ACTIONS_EXECUTOR_RESULT}" != "skipped" ]]; } || \
             { [[ "${M365_CHANGED}" == "true" ]] && [[ "${TEST_M365_COMMUNICATIONS_EXECUTOR_RESULT}" != "success" ]]; } || \
             { [[ "${M365_CHANGED}" != "true" ]] && [[ "${M365_CHANGED}" != "false" ]]; } || \
             { [[ "${M365_CHANGED}" == "false" ]] && [[ "${TEST_M365_COMMUNICATIONS_EXECUTOR_RESULT}" != "skipped" ]]; } || \
             { [[ "${WEB_CHANGED}" == "true" ]] && [[ "${TEST_WEB_RESULT}" != "success" ]]; } || \
             { [[ "${WEB_CHANGED}" != "true" ]] && [[ "${WEB_CHANGED}" != "false" ]]; } || \
             { [[ "${WEB_CHANGED}" == "false" ]] && [[ "${TEST_WEB_RESULT}" != "skipped" ]]; } || \
             [[ "${TEST_MOBILE_RESULT}" != "success" ]] || \
             [[ "${MOBILE_NATIVE_CHANGES_RESULT}" != "success" ]] || \
             { [[ "${MOBILE_NATIVE_REQUIRED}" == "true" ]] && [[ "${BUILD_MOBILE_IOS_RESULT}" != "success" ]]; } || \
             { [[ "${MOBILE_NATIVE_REQUIRED}" != "true" ]] && [[ "${MOBILE_NATIVE_REQUIRED}" != "false" ]]; } || \
             { [[ "${MOBILE_NATIVE_REQUIRED}" == "false" ]] && [[ "${BUILD_MOBILE_IOS_RESULT}" != "skipped" ]]; } || \
             { [[ "${PORTAL_CHANGED}" == "true" ]] && [[ "${TEST_PORTAL_RESULT}" != "success" ]]; } || \
             { [[ "${PORTAL_CHANGED}" != "true" ]] && [[ "${PORTAL_CHANGED}" != "false" ]]; } || \
             { [[ "${PORTAL_CHANGED}" == "false" ]] && [[ "${TEST_PORTAL_RESULT}" != "skipped" ]]; } || \
             [[ "${TEST_VIEWER_RESULT}" != "success" ]] || \
             [[ "${TEST_SHARED_RESULT}" != "success" ]] || \
             [[ "${TEST_DOCUMENT_UI_RESULT}" != "success" ]] || \
             { [[ "${ADDINS_CHANGED}" == "true" ]] && [[ "${TEST_OFFICE_ADDIN_CORE_RESULT}" != "success" ]]; } || \
             { [[ "${ADDINS_CHANGED}" != "true" ]] && [[ "${ADDINS_CHANGED}" != "false" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "false" ]] && [[ "${TEST_OFFICE_ADDIN_CORE_RESULT}" != "skipped" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "true" ]] && [[ "${TEST_EXCEL_ADDIN_RESULT}" != "success" ]]; } || \
             { [[ "${ADDINS_CHANGED}" != "true" ]] && [[ "${ADDINS_CHANGED}" != "false" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "false" ]] && [[ "${TEST_EXCEL_ADDIN_RESULT}" != "skipped" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "true" ]] && [[ "${TEST_WORD_ADDIN_RESULT}" != "success" ]]; } || \
             { [[ "${ADDINS_CHANGED}" != "true" ]] && [[ "${ADDINS_CHANGED}" != "false" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "false" ]] && [[ "${TEST_WORD_ADDIN_RESULT}" != "skipped" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "true" ]] && [[ "${TEST_POWERPOINT_ADDIN_RESULT}" != "success" ]]; } || \
             { [[ "${ADDINS_CHANGED}" != "true" ]] && [[ "${ADDINS_CHANGED}" != "false" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "false" ]] && [[ "${TEST_POWERPOINT_ADDIN_RESULT}" != "skipped" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "true" ]] && [[ "${TEST_OUTLOOK_ADDIN_RESULT}" != "success" ]]; } || \
             { [[ "${ADDINS_CHANGED}" != "true" ]] && [[ "${ADDINS_CHANGED}" != "false" ]]; } || \
             { [[ "${ADDINS_CHANGED}" == "false" ]] && [[ "${TEST_OUTLOOK_ADDIN_RESULT}" != "skipped" ]]; } || \
             { [[ "${API_CHANGED}" == "true" ]] && [[ "${BUILD_API_RESULT}" != "success" ]]; } || \
             { [[ "${API_CHANGED}" != "true" ]] && [[ "${API_CHANGED}" != "false" ]]; } || \
             { [[ "${API_CHANGED}" == "false" ]] && [[ "${BUILD_API_RESULT}" != "skipped" ]]; } || \
             { [[ "${M365_CHANGED}" == "true" ]] && [[ "${BUILD_M365_GRAPH_READ_EXECUTOR_RESULT}" != "success" ]]; } || \
             { [[ "${M365_CHANGED}" != "true" ]] && [[ "${M365_CHANGED}" != "false" ]]; } || \
             { [[ "${M365_CHANGED}" == "false" ]] && [[ "${BUILD_M365_GRAPH_READ_EXECUTOR_RESULT}" != "skipped" ]]; } || \
             { [[ "${M365_CHANGED}" == "true" ]] && [[ "${BUILD_M365_GRAPH_ACTIONS_EXECUTOR_RESULT}" != "success" ]]; } || \
             { [[ "${M365_CHANGED}" != "true" ]] && [[ "${M365_CHANGED}" != "false" ]]; } || \
             { [[ "${M365_CHANGED}" == "false" ]] && [[ "${BUILD_M365_GRAPH_ACTIONS_EXECUTOR_RESULT}" != "skipped" ]]; } || \
             { [[ "${M365_CHANGED}" == "true" ]] && [[ "${BUILD_M365_COMMUNICATIONS_EXECUTOR_RESULT}" != "success" ]]; } || \
             { [[ "${M365_CHANGED}" != "true" ]] && [[ "${M365_CHANGED}" != "false" ]]; } || \
             { [[ "${M365_CHANGED}" == "false" ]] && [[ "${BUILD_M365_COMMUNICATIONS_EXECUTOR_RESULT}" != "skipped" ]]; } || \
             { [[ "${WEB_CHANGED}" == "true" ]] && [[ "${BUILD_WEB_RESULT}" != "success" ]]; } || \
             { [[ "${WEB_CHANGED}" != "true" ]] && [[ "${WEB_CHANGED}" != "false" ]]; } || \
             { [[ "${WEB_CHANGED}" == "false" ]] && [[ "${BUILD_WEB_RESULT}" != "skipped" ]]; } || \
             { [[ "${PORTAL_CHANGED}" == "true" ]] && [[ "${BUILD_PORTAL_RESULT}" != "success" ]]; } || \
             { [[ "${PORTAL_CHANGED}" != "true" ]] && [[ "${PORTAL_CHANGED}" != "false" ]]; } || \
             { [[ "${PORTAL_CHANGED}" == "false" ]] && [[ "${BUILD_PORTAL_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "true" ]] && [[ "${BUILD_AGENT_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" != "true" ]] && [[ "${AGENT_CODE_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "false" ]] && [[ "${BUILD_AGENT_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "true" ]] && [[ "${LINT_AGENT_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" != "true" ]] && [[ "${AGENT_CODE_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "false" ]] && [[ "${LINT_AGENT_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "true" ]] && [[ "${TEST_AGENT_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" != "true" ]] && [[ "${AGENT_CODE_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "false" ]] && [[ "${TEST_AGENT_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "true" ]] && [[ "${AGENT_WINDOWS_MANIFEST_GUARD_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" != "true" ]] && [[ "${AGENT_CODE_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "false" ]] && [[ "${AGENT_WINDOWS_MANIFEST_GUARD_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "true" ]] && [[ "${TEST_AGENT_WINDOWS_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" != "true" ]] && [[ "${AGENT_CODE_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "false" ]] && [[ "${TEST_AGENT_WINDOWS_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "true" ]] && [[ "${WINDOWS_RUNTIME_SMOKE_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" != "true" ]] && [[ "${AGENT_CODE_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CODE_CHANGED}" == "false" ]] && [[ "${WINDOWS_RUNTIME_SMOKE_RESULT}" != "skipped" ]]; } || \
             { [[ "${INTEGRATION_CHANGED}" == "true" ]] && [[ "${INTEGRATION_TEST_RESULT}" != "success" ]]; } || \
             { [[ "${INTEGRATION_CHANGED}" != "true" ]] && [[ "${INTEGRATION_CHANGED}" != "false" ]]; } || \
             { [[ "${INTEGRATION_CHANGED}" == "false" ]] && [[ "${INTEGRATION_TEST_RESULT}" != "skipped" ]]; } || \
             { [[ "${API_CHANGED}" == "true" ]] && [[ "${CHECK_MIGRATIONS_NONSUPERUSER_RESULT}" != "success" ]]; } || \
             { [[ "${API_CHANGED}" != "true" ]] && [[ "${API_CHANGED}" != "false" ]]; } || \
             { [[ "${API_CHANGED}" == "false" ]] && [[ "${CHECK_MIGRATIONS_NONSUPERUSER_RESULT}" != "skipped" ]]; } || \
             [[ "${AUTH_BROWSER_TRANSITION_BROWSER_CONTRACT_RESULT}" != "success" ]] || \
             { [[ "${API_CHANGED}" == "true" ]] && [[ "${CHECK_MIGRATIONS_RESULT}" != "success" ]]; } || \
             { [[ "${API_CHANGED}" != "true" ]] && [[ "${API_CHANGED}" != "false" ]]; } || \
             { [[ "${API_CHANGED}" == "false" ]] && [[ "${CHECK_MIGRATIONS_RESULT}" != "skipped" ]]; } || \
             { [[ "${STACK_CHANGED}" == "false" ]] && [[ "${BUILD_SMOKE_IMAGES_RESULT}" != "skipped" ]]; } || \
             { [[ "${STACK_CHANGED}" == "false" ]] && [[ "${SMOKE_TEST_RESULT}" != "skipped" ]]; } || \
             { [[ "${STACK_CHANGED}" == "false" ]] && [[ "${GUIDED_SETUP_SMOKE_RESULT}" != "skipped" ]]; } || \
             { [[ "${RUST_CHANGED}" == "true" ]] && [[ "${RUST_CHECK_RESULT}" != "success" ]]; } || \
             { [[ "${RUST_CHANGED}" != "true" ]] && [[ "${RUST_CHANGED}" != "false" ]]; } || \
             { [[ "${RUST_CHANGED}" == "false" ]] && [[ "${RUST_CHECK_RESULT}" != "skipped" ]]; }; }; } || \
             { [[ "${APP_CHANGED}" != "true" ]] && [[ "${APP_CHANGED}" != "false" ]]; } || \
             { [[ "${APP_CHANGED}" == "false" ]] && { \
             [[ "${CHECK_MIGRATIONS_RESULT}" != "success" ]] || \
             [[ "${WORKSPACE_RUNTIME_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_SMOKE_IMAGES_RESULT}" != "skipped" ]] || \
             [[ "${SMOKE_TEST_RESULT}" != "skipped" ]] || \
             [[ "${GUIDED_SETUP_SMOKE_RESULT}" != "skipped" ]] || \
             [[ "${TYPECHECK_RESULT}" != "skipped" ]] || \
             [[ "${TEST_API_RESULT}" != "skipped" ]] || \
             [[ "${TEST_M365_GRAPH_READ_EXECUTOR_RESULT}" != "skipped" ]] || \
             [[ "${TEST_M365_GRAPH_ACTIONS_EXECUTOR_RESULT}" != "skipped" ]] || \
             [[ "${TEST_M365_COMMUNICATIONS_EXECUTOR_RESULT}" != "skipped" ]] || \
             [[ "${TEST_WEB_RESULT}" != "skipped" ]] || \
             [[ "${TEST_MOBILE_RESULT}" != "skipped" ]] || \
             [[ "${MOBILE_NATIVE_CHANGES_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_MOBILE_IOS_RESULT}" != "skipped" ]] || \
             [[ "${TEST_PORTAL_RESULT}" != "skipped" ]] || \
             [[ "${TEST_VIEWER_RESULT}" != "skipped" ]] || \
             [[ "${TEST_SHARED_RESULT}" != "skipped" ]] || \
             [[ "${TEST_DOCUMENT_UI_RESULT}" != "skipped" ]] || \
             [[ "${TEST_OFFICE_ADDIN_CORE_RESULT}" != "skipped" ]] || \
             [[ "${TEST_EXCEL_ADDIN_RESULT}" != "skipped" ]] || \
             [[ "${TEST_WORD_ADDIN_RESULT}" != "skipped" ]] || \
             [[ "${TEST_POWERPOINT_ADDIN_RESULT}" != "skipped" ]] || \
             [[ "${TEST_OUTLOOK_ADDIN_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_API_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_M365_GRAPH_READ_EXECUTOR_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_M365_GRAPH_ACTIONS_EXECUTOR_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_M365_COMMUNICATIONS_EXECUTOR_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_WEB_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_PORTAL_RESULT}" != "skipped" ]] || \
             [[ "${BUILD_AGENT_RESULT}" != "skipped" ]] || \
             [[ "${LINT_AGENT_RESULT}" != "skipped" ]] || \
             [[ "${TEST_AGENT_RESULT}" != "skipped" ]] || \
             [[ "${AGENT_WINDOWS_MANIFEST_GUARD_RESULT}" != "skipped" ]] || \
             [[ "${TEST_AGENT_WINDOWS_RESULT}" != "skipped" ]] || \
             [[ "${WINDOWS_RUNTIME_SMOKE_RESULT}" != "skipped" ]] || \
             [[ "${INTEGRATION_TEST_RESULT}" != "skipped" ]] || \
             [[ "${CHECK_MIGRATIONS_NONSUPERUSER_RESULT}" != "skipped" ]] || \
             [[ "${AUTH_BROWSER_TRANSITION_BROWSER_CONTRACT_RESULT}" != "skipped" ]] || \
             [[ "${TOPOLOGY_BROWSER_GATE_RESULT}" != "skipped" ]] || \
             [[ "${RUST_CHECK_RESULT}" != "skipped" ]]; }; } || \
             { [[ "${TOPOLOGY_BROWSER_CHANGED}" == "true" ]] && [[ "${TOPOLOGY_BROWSER_GATE_RESULT}" != "success" ]]; } || \
             { [[ "${TOPOLOGY_BROWSER_GATE_RESULT}" != "success" ]] && [[ "${TOPOLOGY_BROWSER_GATE_RESULT}" != "skipped" ]]; } || \
             { [[ "${AGENT_CHANGED}" == "true" ]] && [[ "${RECOVERY_MEDIA_E2E_RESULT}" != "success" ]]; } || \
             { [[ "${AGENT_CHANGED}" != "true" ]] && [[ "${AGENT_CHANGED}" != "false" ]]; } || \
             { [[ "${AGENT_CHANGED}" == "false" ]] && [[ "${RECOVERY_MEDIA_E2E_RESULT}" != "skipped" ]]; }; }; }; then
            echo "One or more required jobs failed"
            exit 1
          fi
          if [[ "${CODE_CHANGED}" == "false" ]]; then
            echo "Docs-only PR: code jobs skipped, docs-check passed; the merge queue runs the full suite before merge."
            exit 0
          fi
          if [[ "${APP_CHANGED}" == "false" ]]; then
            echo "Tooling-only change: lint, check-migrations (release-lineage guards) and security-audit passed; the app suite was skipped because no application path changed."
            exit 0
          fi
          # Workspace runtime image: non-blocking on PRs (continue-on-error), required
          # in the merge queue and manual main validation — same policy as the smoke suites.
          # Only reached when APP_CHANGED == 'true' (the branch above already returned for
          # 'false', and the main assertion above already rejected any other value), so
          # this job actually ran rather than being skipped by its own app gate.
          if [[ "${IS_PR}" != "true" ]] && [[ "${WORKSPACE_RUNTIME_RESULT}" != "success" ]]; then
            echo "Workspace runtime smoke failed during merge-queue or manual validation"
            exit 1
          fi
          # The shared producer has the same policy as its smoke consumers.
          if [[ "${IS_PR}" != "true" ]] && [[ "${STACK_CHANGED}" == "true" ]] && [[ "${BUILD_SMOKE_IMAGES_RESULT}" != "success" ]]; then
            echo "Smoke image build failed during merge-queue or manual validation"
            exit 1
          fi
          # Smoke test: non-blocking on PRs, required in the merge queue and manual validation
          if [[ "${IS_PR}" != "true" ]] && [[ "${STACK_CHANGED}" == "true" ]] && [[ "${SMOKE_TEST_RESULT}" != "success" ]]; then
            echo "Smoke test failed on main branch push"
            exit 1
          fi
          # Guided installer smoke: same policy — non-blocking on PRs, required on main
          if [[ "${IS_PR}" != "true" ]] && [[ "${STACK_CHANGED}" == "true" ]] && [[ "${GUIDED_SETUP_SMOKE_RESULT}" != "success" ]]; then
            echo "Guided setup smoke failed on main branch push"
            exit 1
          fi
          echo "All required jobs passed!"
  main-red-alert:
    name: Main Red Alert
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
  provenance-record:
    name: Record CI Provenance
    runs-on: ubuntu-latest
    needs: [changes, ci-success]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.ci-success.result == 'success' }}
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
