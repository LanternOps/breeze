          BUILD_MOBILE_IOS_RESULT: ${{ needs.build-mobile-ios.result }}
          TEST_PORTAL_RESULT: ${{ needs.test-portal.result }}
          TEST_VIEWER_RESULT: ${{ needs.test-viewer.result }}
