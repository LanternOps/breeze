             { [[ "${APP_CHANGED}" == "true" ]] && { \
             [[ "${TYPECHECK_RESULT}" != "success" ]] || \
             { [[ "${API_CHANGED}" == "true" ]] && [[ "${TEST_API_RESULT}" != "success" ]]; } || \
             { [[ "${API_CHANGED}" != "true" ]] && [[ "${API_CHANGED}" != "false" ]]; } || \
