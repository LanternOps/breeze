          INTEGRATION_CHANGED: ${{ needs.changes.outputs.integration }}
          PATH_READERS_CHANGED: ${{ needs.changes.outputs.path_readers }}
          PATH_READ_CONTRACTS_RESULT: ${{ needs.path-read-contracts.result }}
