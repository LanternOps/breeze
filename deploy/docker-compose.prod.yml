# Breeze RMM - Production Deployment (US + EU)
#
# Identical on both droplets. Region-specific values come from .env.
# See deploy/.env.example for required variables.
#
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Production images are intentionally immutable. Set the *_IMAGE_DIGEST values
# to sha256 digests produced by the release pipeline, and set third-party
# *_IMAGE_REF values to digest-pinned image references.

x-healthcheck-defaults: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3

services:
  binaries-init:
    image: ghcr.io/lanternops/breeze/binaries@${BREEZE_BINARIES_IMAGE_DIGEST:?Set BREEZE_BINARIES_IMAGE_DIGEST to the release image digest}
    pull_policy: always
    container_name: breeze-binaries-init
    volumes:
      - binaries:/target
    restart: "no"

  caddy:
    image: ${CADDY_IMAGE_REF:?Set CADDY_IMAGE_REF to a digest-pinned Caddy image}
    container_name: breeze-caddy
    restart: unless-stopped
    environment:
      CADDY_TRUSTED_PROXIES: "${CADDY_TRUSTED_PROXIES:-172.30.0.10/32}"
      CADDY_CLIENT_IP_HEADERS: "${CADDY_CLIENT_IP_HEADERS:-CF-Connecting-IP X-Forwarded-For}"
      REMOTE_ACCESS_ADMISSION_MODE: ${REMOTE_ACCESS_ADMISSION_MODE:?Set REMOTE_ACCESS_ADMISSION_MODE to open or closed}
    volumes:
      - ../docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      portal:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'caddy', 'version']
      start_period: 20s
    networks:
      breeze:
        ipv4_address: ${BREEZE_CADDY_IP:-172.30.0.11}

  tunnel:
    image: ${CLOUDFLARED_IMAGE_REF:?Set CLOUDFLARED_IMAGE_REF to a digest-pinned cloudflared image}
    container_name: breeze-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - /opt/breeze/cloudflared:/etc/cloudflared:ro
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      breeze:
        ipv4_address: ${BREEZE_CLOUDFLARED_IP:-172.30.0.10}

  api:
    image: ghcr.io/lanternops/breeze/api@${BREEZE_API_IMAGE_DIGEST:?Set BREEZE_API_IMAGE_DIGEST to the release image digest}
    platform: linux/amd64
    container_name: breeze-api
    restart: unless-stopped
    # Keep the root filesystem writable while redis_password is environment-backed;
    # standalone Compose supports only file-backed secrets for read-only services.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Production requires ONE of DATABASE_URL_APP / BREEZE_APP_DB_PASSWORD /
      # POSTGRES_PASSWORD to configure the unprivileged request role (#2368).
      # All three must be mapped here — the validator names POSTGRES_PASSWORD as
      # a valid option, and compose only interpolates vars listed in this block,
      # so omitting it makes that advice silently fail.
      DATABASE_URL_APP: ${DATABASE_URL_APP:-}
      BREEZE_APP_DB_PASSWORD: ${BREEZE_APP_DB_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REMOTE_ACCESS_ADMISSION_MODE: ${REMOTE_ACCESS_ADMISSION_MODE:?Set REMOTE_ACCESS_ADMISSION_MODE to open or closed}
      REMOTE_WS_AUTH_MODE: ${REMOTE_WS_AUTH_MODE:?Set REMOTE_WS_AUTH_MODE to post_upgrade or pre_upgrade}
      REMOTE_WS_REDIS_TOPOLOGY: ${REMOTE_WS_REDIS_TOPOLOGY:?Set REMOTE_WS_REDIS_TOPOLOGY to standalone-single-primary}
      REMOTE_WS_LEGACY_TICKET_WRITER_DRAINED_AT: ${REMOTE_WS_LEGACY_TICKET_WRITER_DRAINED_AT:-}
      REMOTE_WS_LEGACY_VIEWER_ISSUER_DRAINED_AT: ${REMOTE_WS_LEGACY_VIEWER_ISSUER_DRAINED_AT:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PARTNER_API_CURSOR_SIGNING_KEY: ${PARTNER_API_CURSOR_SIGNING_KEY:?Set PARTNER_API_CURSOR_SIGNING_KEY in .env}
      AGENT_ENROLLMENT_SECRET: ${AGENT_ENROLLMENT_SECRET:?Set AGENT_ENROLLMENT_SECRET in .env}
      # Backup control-plane URL pushed to agents via heartbeat (#2288);
      # see docs/deploy/agent-server-url-migration.md
      AGENT_BACKUP_SERVER_URL: ${AGENT_BACKUP_SERVER_URL:-}
      BREEZE_BOOTSTRAP_ADMIN_EMAIL: ${BREEZE_BOOTSTRAP_ADMIN_EMAIL:-}
      BREEZE_BOOTSTRAP_ADMIN_PASSWORD: ${BREEZE_BOOTSTRAP_ADMIN_PASSWORD:-}
      BREEZE_BOOTSTRAP_ADMIN_NAME: ${BREEZE_BOOTSTRAP_ADMIN_NAME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${BREEZE_DOMAIN}}
      PUBLIC_APP_URL: https://${BREEZE_DOMAIN}
      DASHBOARD_URL: https://${BREEZE_DOMAIN}
      PUBLIC_API_URL: https://${BREEZE_DOMAIN}
      # Customer-portal origin for emailed links (quotes, invoices). Portal is
      # served under /portal on the main domain.
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-https://${BREEZE_DOMAIN}/portal}
      API_URL: ${API_URL:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      # Optional, but required once M365_GRAPH_ACTIONS_TOOLS_ENABLED=true below —
      # boot refuses to start without it (see that var's comment). Must be set
      # here AND in .env; compose only interpolates vars listed in this block.
      APP_ENCRYPTION_KEY_ID: ${APP_ENCRYPTION_KEY_ID:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env}
      ENROLLMENT_KEY_PEPPER: ${ENROLLMENT_KEY_PEPPER:?Set ENROLLMENT_KEY_PEPPER in .env}
      # Enrollment link / bootstrap token lifetimes + the expired-key sweep
      # (#2775, #2776). Baked defaults rather than `:-}`: an unset var rendered
      # as `VAR: ""` reaches the container SET to an empty string, which a
      # `Number(process.env.X ?? default)` reader turns into 0 — a 0-minute TTL
      # mints tokens that are already expired.
      CHILD_ENROLLMENT_KEY_TTL_MINUTES: ${CHILD_ENROLLMENT_KEY_TTL_MINUTES:-1440}
      INSTALLER_BOOTSTRAP_TOKEN_TTL_MINUTES: ${INSTALLER_BOOTSTRAP_TOKEN_TTL_MINUTES:-1440}
      INSTALLER_PARENT_MIN_REMAINING_SECONDS: ${INSTALLER_PARENT_MIN_REMAINING_SECONDS:-60}
      ENROLLMENT_KEY_CLEANUP_ENABLED: ${ENROLLMENT_KEY_CLEANUP_ENABLED:-true}
      ENROLLMENT_KEY_PURGE_AFTER_DAYS: ${ENROLLMENT_KEY_PURGE_AFTER_DAYS:-7}
      MFA_RECOVERY_CODE_PEPPER: ${MFA_RECOVERY_CODE_PEPPER:?Set MFA_RECOVERY_CODE_PEPPER in .env}
      PATCH_REPORT_STORAGE_PATH: /data/patch-reports
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: "true"
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      OAUTH_AUTH_EPOCH_ENFORCE_AFTER: ${OAUTH_AUTH_EPOCH_ENFORCE_AFTER:-}
      EVENT_PERMISSION_EPOCH_MODE: ${EVENT_PERMISSION_EPOCH_MODE:?Set EVENT_PERMISSION_EPOCH_MODE to compat or enforce}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@2breeze.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Breeze AI for Office (Excel add-in). Entra app-registration client ID that
      # gates the /client-ai exchange + admin surface. Empty/unmapped = surface
      # stays dark (env.ts defaults to ''). Threaded through compose so the feature
      # can be enabled from .env. Same gap class as IS_HOSTED above.
      CLIENT_AI_ENTRA_CLIENT_ID: ${CLIENT_AI_ENTRA_CLIENT_ID:-}
      # Optional customer Graph-read onboarding. The executor is intentionally
      # not part of this generic Compose stack: deploy it separately with a
      # workload identity, private ingress, and controlled HTTPS egress.
      M365_CUSTOMER_GRAPH_READ_ONBOARDING_ENABLED: ${M365_CUSTOMER_GRAPH_READ_ONBOARDING_ENABLED:-false}
      M365_CUSTOMER_GRAPH_READ_ONBOARDING_ORG_IDS: ${M365_CUSTOMER_GRAPH_READ_ONBOARDING_ORG_IDS:-}
      M365_CUSTOMER_GRAPH_READ_CLIENT_ID: ${M365_CUSTOMER_GRAPH_READ_CLIENT_ID:-}
      M365_CUSTOMER_GRAPH_READ_CALLBACK_URL: ${M365_CUSTOMER_GRAPH_READ_CALLBACK_URL:-}
      M365_CUSTOMER_GRAPH_READ_CREDENTIAL_VERSION: ${M365_CUSTOMER_GRAPH_READ_CREDENTIAL_VERSION:-}
      M365_CUSTOMER_GRAPH_READ_VAULT_REF: ${M365_CUSTOMER_GRAPH_READ_VAULT_REF:-}
      M365_GRAPH_READ_EXECUTOR_URL: ${M365_GRAPH_READ_EXECUTOR_URL:-}
      M365_GRAPH_READ_EXECUTOR_AUDIENCE: ${M365_GRAPH_READ_EXECUTOR_AUDIENCE:-m365-graph-read-executor}
      M365_GRAPH_READ_EXECUTOR_SIGNING_KID: ${M365_GRAPH_READ_EXECUTOR_SIGNING_KID:-}
      M365_GRAPH_READ_EXECUTOR_SIGNING_PRIVATE_JWK_FILE: /run/secrets/m365_graph_read_executor_signing_private_jwk
      # Optional customer Graph-actions (write) executor. Same isolation model
      # as the Graph-read executor above: intentionally not part of this
      # generic Compose stack — deploy it separately with a workload identity,
      # private ingress, and controlled HTTPS egress. Disabled by default.
      # ONBOARDING_ENABLED gates the org-facing consent card; TOOLS_ENABLED
      # (below) independently gates the AI tools/headless execution — either
      # one enabled forces full executor descriptor validation at boot, which
      # in production also requires PUBLIC_APP_URL/PUBLIC_API_URL (or
      # PUBLIC_URL) to derive the consent callback origin (both are already
      # mapped above).
      M365_CUSTOMER_GRAPH_ACTIONS_ONBOARDING_ENABLED: ${M365_CUSTOMER_GRAPH_ACTIONS_ONBOARDING_ENABLED:-false}
      M365_CUSTOMER_GRAPH_ACTIONS_ONBOARDING_ORG_IDS: ${M365_CUSTOMER_GRAPH_ACTIONS_ONBOARDING_ORG_IDS:-}
      # Enabling this also requires APP_ENCRYPTION_KEY_ID above — boot refuses
      # to start without it, because the m365_reset_password reveal-secret
      # path seals its temp credential with AAD-bound v3 ciphertext.
      M365_GRAPH_ACTIONS_TOOLS_ENABLED: ${M365_GRAPH_ACTIONS_TOOLS_ENABLED:-false}
      M365_GRAPH_ACTIONS_TOOLS_ORG_IDS: ${M365_GRAPH_ACTIONS_TOOLS_ORG_IDS:-}
      M365_CUSTOMER_GRAPH_ACTIONS_CLIENT_ID: ${M365_CUSTOMER_GRAPH_ACTIONS_CLIENT_ID:-}
      M365_CUSTOMER_GRAPH_ACTIONS_CREDENTIAL_VERSION: ${M365_CUSTOMER_GRAPH_ACTIONS_CREDENTIAL_VERSION:-}
      M365_CUSTOMER_GRAPH_ACTIONS_VAULT_REF: ${M365_CUSTOMER_GRAPH_ACTIONS_VAULT_REF:-}
      M365_GRAPH_ACTIONS_EXECUTOR_URL: ${M365_GRAPH_ACTIONS_EXECUTOR_URL:-}
      M365_GRAPH_ACTIONS_EXECUTOR_AUDIENCE: ${M365_GRAPH_ACTIONS_EXECUTOR_AUDIENCE:-m365-graph-actions-executor}
      M365_GRAPH_ACTIONS_EXECUTOR_SIGNING_KID: ${M365_GRAPH_ACTIONS_EXECUTOR_SIGNING_KID:-}
      M365_GRAPH_ACTIONS_EXECUTOR_SIGNING_PRIVATE_JWK_FILE: /run/secrets/m365_graph_actions_executor_signing_private_jwk
      APP_VERSION: ${BREEZE_VERSION:?Set BREEZE_VERSION in .env}
      BREEZE_VERSION: ${BREEZE_VERSION:?Set BREEZE_VERSION in .env}
      BINARY_SOURCE: github
      RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS: ${RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS:?Set RELEASE_ARTIFACT_MANIFEST_PUBLIC_KEYS in .env}
      # Hosted SaaS gate (#570). This template is for hosted deploys, so
      # IS_HOSTED is required-explicit — operators must set it in .env.
      # Misconfiguration here silently drops new partners to status='active'
      # and bypasses the email-verification flow.
      IS_HOSTED: ${IS_HOSTED:?Set IS_HOSTED in .env (true for hosted SaaS, false for self-hosted)}
      AGENT_BINARY_DIR: /data/binaries/agent
      VIEWER_BINARY_DIR: /data/binaries/viewer
      HELPER_BINARY_DIR: /data/binaries/helper
      BINARY_VERSION_FILE: /data/binaries/VERSION
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-900}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-172.30.0.11/32}"
      # This reference stack is fronted by Cloudflare (cloudflared → Caddy), so
      # CF-Connecting-IP is authoritative. Self-hosters NOT behind Cloudflare
      # must leave this unset — see the base docker-compose.yml note.
      TRUST_CF_CONNECTING_IP: "${TRUST_CF_CONNECTING_IP:-true}"
      # off is the safe mixed-version default even on this hosted reference
      # stack: the edge certificate assertion is never consulted until an
      # operator explicitly advances it through the audit rollout. Never
      # inferred from NODE_ENV/IS_HOSTED/CF_MTLS_*. See
      # docs/operations/cloudflare-mtls-setup.md for the rollout sequence.
      AGENT_MTLS_BINDING_MODE: ${AGENT_MTLS_BINDING_MODE:-off}
      # Wave 6 security remediation rollout controls. Default-bearing form so
      # a missing value cannot make the stack refuse to start — both are
      # compatibility controls whose defaults are the safe state. See
      # docs/operations/agent-network-and-manifest-rollout.md before setting
      # either to anything other than its default in production.
      #
      # AGENT_REQUIRE_MANIFEST_SIGNING_KEY_ID: NOT a no-op and NOT fleet-wide.
      # A capable agent (this build or newer) applies a pushed `true`/`false`
      # on its next update check (re-read at updater-construction time; its
      # helper-manager needs a restart to pick up the change, same limitation
      # as backup_server_url). An agent build older than this one ignores the
      # pushed value entirely and keeps accepting ID-less manifests.
      # The key is always sent, as true or false, so reverting this variable
      # rolls capable agents back on their next heartbeat.
      AGENT_REQUIRE_MANIFEST_SIGNING_KEY_ID: ${AGENT_REQUIRE_MANIFEST_SIGNING_KEY_ID:-false}
      MANAGED_SOFTWARE_POLICY_MODE: ${MANAGED_SOFTWARE_POLICY_MODE:-compat}
      PARTNER_HOOKS_URL: http://billing:3002/hooks
      BILLING_SERVICE_URL: http://billing:3002
      BILLING_SERVICE_API_KEY: ${BILLING_SERVICE_API_KEY:-}
      MSI_SIGNING_URL: ${MSI_SIGNING_URL:-}
      MSI_SIGNING_CF_ACCESS_ID: ${MSI_SIGNING_CF_ACCESS_ID:-}
      MSI_SIGNING_CF_ACCESS_SECRET: ${MSI_SIGNING_CF_ACCESS_SECRET:-}
      # Signup-abuse-detection sweep (docs/superpowers/specs/security-auth/2026-07-11-signup-abuse-detection-design.md).
      # Optional — empty/unmapped means ops alerting stays dark and per-signal
      # thresholds fall back to config.ts defaults.
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      OPS_ALERT_LABEL: ${OPS_ALERT_LABEL:-}
      ABUSE_SIGNAL_OVERRIDES: ${ABUSE_SIGNAL_OVERRIDES:-}
      ABUSE_SCRIPT_INDICATORS: ${ABUSE_SCRIPT_INDICATORS:-}
      # Native APNs push for the iOS app (all optional; unset = push disabled).
      # All-or-none: setting ANY of these makes the four credentials required,
      # so a half-configured relay fails at boot instead of silently at first
      # send. Empty values are treated as unset.
      APNS_AUTH_KEY: ${APNS_AUTH_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-}
      # --- Additional API runtime settings (parity with deploy/.env.example) ---
      # Documented in deploy/.env.example and read by the API but previously not
      # threaded through this block, so setting them in .env was a silent no-op.
      # `${VAR:-}` is non-regressive: empty is falsy to envFlag/envInt, which
      # fall back to their in-code default. Enforced by
      # apps/api/src/config/envComposeParity.test.ts.
      IP_ALLOWLIST_ENFORCEMENT_MODE: ${IP_ALLOWLIST_ENFORCEMENT_MODE:-}
      M365_GRAPH_READ_TOOLS_ENABLED: ${M365_GRAPH_READ_TOOLS_ENABLED:-}
      M365_GRAPH_READ_TOOLS_ORG_IDS: ${M365_GRAPH_READ_TOOLS_ORG_IDS:-}
      # Synthetic sign-up monitor endpoints (deploy/.env.example calls out that
      # these MUST be mapped here for compose interpolation to reach the API).
      SYNTHETIC_TEST_TOKEN: ${SYNTHETIC_TEST_TOKEN:-}
      SYNTHETIC_TEST_IP_ALLOWLIST: ${SYNTHETIC_TEST_IP_ALLOWLIST:-}
    volumes:
      - api_data:/data
      - binaries:/data/binaries:ro
    secrets:
      - redis_password
      - source: m365_graph_read_executor_signing_private_jwk
        target: m365_graph_read_executor_signing_private_jwk
      - source: m365_graph_actions_executor_signing_private_jwk
        target: m365_graph_actions_executor_signing_private_jwk
    depends_on:
      binaries-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/health']
      start_period: 40s
    networks:
      - breeze

  web:
    image: ghcr.io/lanternops/breeze/web@${BREEZE_WEB_IMAGE_DIGEST:?Set BREEZE_WEB_IMAGE_DIGEST to the release image digest}
    platform: linux/amd64
    container_name: breeze-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_API_URL: https://${BREEZE_DOMAIN}
      PUBLIC_BILLING_URL: https://${BREEZE_DOMAIN}
      PUBLIC_SENTRY_DSN_WEB: ${PUBLIC_SENTRY_DSN_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:4321/']
      start_period: 30s
    networks:
      - breeze

  portal:
    image: ghcr.io/lanternops/breeze/portal@${BREEZE_PORTAL_IMAGE_DIGEST:?Set BREEZE_PORTAL_IMAGE_DIGEST to the release image digest}
    platform: linux/amd64
    container_name: breeze-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4322
      PORTAL_BASE_PATH: ${PORTAL_BASE_PATH:-/portal}
      # Browser calls the API same-origin via the /api/* Caddy route, so the
      # public (client) base stays empty. SSR has no window to derive same-origin,
      # so it reaches the API over the internal network.
      PUBLIC_API_URL: ""
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      PUBLIC_SENTRY_DSN_WEB: ${PUBLIC_SENTRY_DSN_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider "http://127.0.0.1:4322${PORTAL_BASE_PATH:-/portal}/login"']
      start_period: 30s
    networks:
      - breeze

  billing:
    image: ${BILLING_IMAGE_REF:?Set BILLING_IMAGE_REF to a digest-pinned billing image}
    container_name: breeze-billing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BILLING_PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_COMMUNITY_PRICE_ID: ${STRIPE_COMMUNITY_PRICE_ID:-}
      BILLING_API_KEY: ${BILLING_SERVICE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-billing@2breeze.app}
      APP_BASE_URL: https://${BREEZE_DOMAIN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3002/health']
      start_period: 20s
    networks:
      - breeze

  redis:
    image: ${REDIS_IMAGE_REF:?Set REDIS_IMAGE_REF to a digest-pinned Redis image}
    container_name: breeze-redis
    restart: unless-stopped
    command: >
      sh -ec 'password="$$(cat /run/secrets/redis_password)";
      if [ -z "$$password" ] || [ "$$password" = "__GENERATE_ME__" ]; then
        echo "[redis] REDIS_PASSWORD is empty or the __GENERATE_ME__ placeholder. Set REDIS_PASSWORD in .env to a strong value (openssl rand -hex 32)." >&2;
        exit 1;
      fi;
      umask 077;
      printf "%s\n" "appendonly yes" "maxmemory ${REDIS_MAXMEMORY:-256mb}" "maxmemory-policy noeviction" "maxclients 10000" "requirepass $$password" > /tmp/redis.conf;
      exec redis-server /tmp/redis.conf'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'password="$$(cat /run/secrets/redis_password)"; { printf "AUTH %s\r\n" "$$password"; printf "PING\r\n"; } | redis-cli --no-auth-warning | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - breeze

  # TURN relay for WebRTC remote desktop. Opt-in via: docker compose --profile turn up -d
  coturn:
    image: ${COTURN_IMAGE_REF:?Set COTURN_IMAGE_REF to a digest-pinned coturn image}
    container_name: breeze-coturn
    restart: unless-stopped
    profiles:
      - turn
    network_mode: host
    command: >
      turnserver
      --listening-port=3478
      --tls-listening-port=5349
      --fingerprint
      --use-auth-secret
      --relay-threads=4
      --user-quota=4
      --total-quota=1000
      --max-bps=${TURN_MAX_BPS:-5000000}
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.0.0.0-192.0.0.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=198.18.0.0-198.19.255.255
      --denied-peer-ip=224.0.0.0-239.255.255.255
      --denied-peer-ip=240.0.0.0-255.255.255.255
      --denied-peer-ip=::1
      --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --log-file=stdout
      --verbose
      --min-port=49152
      --max-port=65535
      --no-cli
      --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set (openssl rand -hex 32) when the turn profile is enabled}
      --realm=${TURN_REALM:-breeze.local}
      --external-ip=${TURN_HOST:-}

networks:
  breeze:
    name: breeze
    ipam:
      config:
        - subnet: ${BREEZE_DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  binaries:
  caddy_data:
  caddy_config:
  api_data:
  redis_data:

secrets:
  redis_password:
    environment: REDIS_PASSWORD
  # Standalone Compose bind-mounts file-backed secrets and ignores uid/gid/mode
  # target attributes. /dev/null keeps dark deployments optional; when enabled,
  # the source JWK must already have numeric owner 1001:1001 and mode 0400.
  m365_graph_read_executor_signing_private_jwk:
    file: ${M365_GRAPH_READ_EXECUTOR_SIGNING_PRIVATE_JWK_SOURCE_FILE:-/dev/null}
  m365_graph_actions_executor_signing_private_jwk:
    file: ${M365_GRAPH_ACTIONS_EXECUTOR_SIGNING_PRIVATE_JWK_SOURCE_FILE:-/dev/null}
