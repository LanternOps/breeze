# Breeze RMM - TURN Server Configuration
# Used for WebRTC remote desktop connections

listening-port=3478
tls-listening-port=5349

# Use fingerprint in TURN messages
fingerprint

# Use coturn TURN REST API time-limited credentials.
# use-auth-secret enables lt-cred-mech internally and validates usernames of
# the form "<unix-expiry>:<scope>" with static-auth-secret.
use-auth-secret

# Realm
realm=breeze.local

# The static auth secret (overridden by docker-compose env var)
# static-auth-secret is set via command line in docker-compose.yml

# Total relay threads
relay-threads=4

# Allocation quotas
user-quota=4
total-quota=1000

# Breeze's WebRTC
# desktop/viewer sessions only ever need UDP relay allocations. RFC 6062
# TURN-TCP relay is a distinct, rarely-needed feature (relaying a TCP
# connection to a peer) that this deployment does not use, so disable it to
# shrink the relay/abuse surface. This does NOT affect the `?transport=tcp`
# TURN control-channel URL already advertised for UDP-blocked networks —
# that is the client-to-TURN-server transport, not a TCP relay allocation.
no-tcp-relay

# Bandwidth and peer abuse guardrails
max-bps=5000000
no-multicast-peers
# Relay only to public peers. Refused: unspecified, loopback, private/VPC,
# CGNAT (100.64/10, also used by tailnets), link-local (including the cloud
# metadata address 169.254.169.254), documentation/benchmark, 6to4/Teredo,
# multicast and reserved ranges, for IPv4 and IPv6.
# Never add this relay's own public IP (the external-ip) to this list: when
# both peers are relayed through this server, relay-to-relay traffic targets
# that address and would be refused.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# IPv4-mapped IPv6 and NAT64 ranges: enable after verifying relay-to-relay
# on your deployment.
# denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
# denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff

# Logging. verbose is off: it logs detail for every session, including
# unauthenticated ones. Enable it temporarily when debugging.
log-file=stdout

# Relay port range (bounds UDP relay ports for firewall rules)
min-port=49152
max-port=65535

# Disable CLI
no-cli
