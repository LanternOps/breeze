<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece5ff"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 1024 canvas, 824 rounded-square tile, radius ~185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#d8ccf7" stroke-width="4"/>
  <!-- real NU mark, 318x306 scaled to 560 wide, centered -->
  <image href="data:image/png;base64," x="232" y="242" width="560" height="539"/>
</svg>
