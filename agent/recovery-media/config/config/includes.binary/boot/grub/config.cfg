# Overrides live-build's own generated boot/grub/config.cfg (live-build
# copies config/includes.binary/* onto the ISO's binary tree AFTER
# generating its own, so a file at the same path here wins).
#
# Found by actually booting the shipped ISO headless-over-serial (review
# addition to W04b, agent/recovery-media/e2e/run-qemu.sh's OVMF smoke
# boot): live-build's stock config.cfg sets `terminal_output gfxterm` only
# (never serial) and never sets a menu `timeout` at all, which GRUB
# defaults to -1 (wait forever for a keypress). Combined, a boot with no
# VGA display attached — exactly the recovery scenario this media exists
# for: a headless server reached only over serial/IPMI SOL — hangs at a
# GRUB menu nobody can ever see or dismiss. The kernel cmdline's own
# `console=ttyS0,115200n8` (build.sh's --bootappend-live) only takes over
# once Linux itself boots; it does nothing for GRUB's own menu stage.
#
# Fix: mirror GRUB's own terminal to the same serial port/speed the kernel
# cmdline already targets, and give the (single, no-choice-needed) live
# entry a short timeout so it boots automatically — this media's operator
# interaction happens entirely in the recovery console AFTER boot
# (breeze-recovery.service / serial-getty@ttyS0), never at the GRUB menu.
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

set default=0
set timeout=5
