# Runs the same guided recovery console on the serial console
# (ttyS0, 115200n8) as breeze-recovery.service runs on tty1, so an
# operator connected only over serial (headless hardware, most out-of-band
# management consoles) gets the identical flow rather than a login prompt.
[Service]
ExecStart=
ExecStart=-/usr/local/bin/breeze-backup recovery-console
