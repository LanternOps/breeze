# Breeze RMM - Optional Monitoring Stack
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Includes: Prometheus, Grafana, Alertmanager, Loki, Promtail, and DB exporters.
# Requires the base docker-compose.yml to be running.
#
# Every image is digest-pinned and overridable via <SERVICE>_IMAGE_REF
# (PROMETHEUS_, GRAFANA_, ALERTMANAGER_, LOKI_, PROMTAIL_, REDIS_EXPORTER_,
# POSTGRES_EXPORTER_). Refresh pins deliberately: `docker buildx imagetools
# inspect <image:tag>` for the digest, then rerun the promtool/amtool/Loki
# config checks listed in the PR that introduced them (#7812).

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE_REF:-prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06}
    container_name: breeze-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_scrape_token
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - breeze

  grafana:
    image: ${GRAFANA_IMAGE_REF:-grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205}
    container_name: breeze-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: redis-datasource
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards/breeze:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - breeze

  alertmanager:
    image: ${ALERTMANAGER_IMAGE_REF:-prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b}
    container_name: breeze-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - breeze

  loki:
    image: ${LOKI_IMAGE_REF:-grafana/loki:3.6.20@sha256:be040ec94865dabe4821ce1c0f109452bd4b5acb566ae376672696eb43caedb7}
    container_name: breeze-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - breeze

  promtail:
    image: ${PROMTAIL_IMAGE_REF:-grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9}
    container_name: breeze-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - breeze

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE_REF:-oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99}
    container_name: breeze-redis-exporter
    restart: unless-stopped
    command: >
      sh -ec 'export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)";
      exec /redis_exporter'
    environment:
      REDIS_ADDR: redis://redis:6379
    secrets:
      - redis_password
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - breeze

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE_REF:-prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e}
    container_name: breeze-postgres-exporter
    restart: unless-stopped
    # No hard `depends_on: postgres` here on purpose: this overlay must compose
    # cleanly on top of BOTH the root docker-compose.yml (dev, which runs a
    # local `postgres` service) and deploy/docker-compose.prod.yml (prod, which
    # has no local Postgres — it uses a managed database). A `depends_on` on a
    # service name that only exists in one of the two base files makes the
    # combined project invalid ("depends on undefined service") for the other
    # (#4362). `restart: unless-stopped` covers the ordering gap: the exporter
    # simply retries until the DSN below becomes reachable.
    #
    # POSTGRES_EXPORTER_DSN lets prod point this at the managed database
    # instead of the local `postgres` hostname, which does not resolve there.
    # Left unset, it falls back to the local dev DSN (unchanged behavior).
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://${POSTGRES_USER:-breeze}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (local dev postgres) or POSTGRES_EXPORTER_DSN (e.g. prod, no local postgres service) in .env}@postgres:5432/${POSTGRES_DB:-breeze}?sslmode=disable}
    networks:
      - breeze

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_positions:

secrets:
  metrics_scrape_token:
    environment: METRICS_SCRAPE_TOKEN
