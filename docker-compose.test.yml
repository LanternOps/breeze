# Test Docker Compose - Ephemeral services for integration testing
# Usage: docker compose -f docker-compose.test.yml up -d
# Cleanup: docker compose -f docker-compose.test.yml down -v
#          (per-worktree copy: `pnpm test-stack down`). Nothing tears these down
#          for you — `docker compose ls -a` lists every copy still running.
#
# Concurrent worktrees (#3066): the BREEZE_TEST_* variables below let
# `pnpm test-stack up` (scripts/dev/test-stack) run a PRIVATE copy of this
# stack per git worktree — its own compose project, ephemeral host ports, and
# per-project container/network names — so two sessions never TRUNCATE each
# other's database. Every variable defaults to the historical fixed value, so
# plain `docker compose -f docker-compose.test.yml up -d` (CI, single-session
# local) behaves exactly as before.
#
# Host ports bind to 127.0.0.1 only: the test Postgres has a fixed password and
# Redis has no auth, and every client (CI, vitest, test-stack) uses localhost.
# Set BREEZE_TEST_BIND_ADDR (e.g. 0.0.0.0) to publish on another interface.

services:
  # PostgreSQL Database for Tests
  postgres-test:
    # pgvector/pgvector is the official postgres image + the vector extension
    # (a drop-in superset of the stock image for the same major). The default
    # is the shipped major; BREEZE_TEST_PG_IMAGE runs the stack on another one
    # (the scheduled Postgres 17/18 workflow, or locally:
    # `BREEZE_TEST_PG_IMAGE=pgvector/pgvector:pg18 pnpm test-stack up`).
    image: ${BREEZE_TEST_PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: ${BREEZE_TEST_PG_CONTAINER:-breeze-postgres-test}
    # Durability is pointless for a throwaway tmpfs test DB, and the
    # integration suite's per-test TRUNCATE ... CASCADE makes thousands of
    # commits per run — fsync/synchronous_commit off keeps unattended local
    # runs from crawling (and does nothing worse than lose data we delete
    # on `down -v` anyway).
    #
    # Production managed Postgres kills a session idle in transaction for 1 min.
    # Matching it locally is what lets a test catch a connection held across a
    # slow wait before production does (#7918: run_script lost every script
    # that ran longer than a minute).
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c idle_in_transaction_session_timeout=60s
    environment:
      POSTGRES_USER: breeze_test
      POSTGRES_PASSWORD: breeze_test
      POSTGRES_DB: breeze_test
      # Pinned to the tmpfs mount below. The Postgres 18 images moved their
      # default PGDATA to /var/lib/postgresql/18/docker, outside that mount, so
      # without this a pg18 stack writes to the container filesystem instead.
      # scripts/dev/test-stack/composePostgres.test.ts asserts the pairing.
      PGDATA: /var/lib/postgresql/data
    ports:
      # Different port to avoid conflicts with dev. `pnpm test-stack` passes 0
      # to get an ephemeral host port for per-worktree isolation.
      - "${BREEZE_TEST_BIND_ADDR:-127.0.0.1}:${BREEZE_TEST_PG_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for speed, data is ephemeral
    networks:
      - breeze-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breeze_test -d breeze_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  # Redis for Tests
  redis-test:
    image: redis:8-alpine
    container_name: ${BREEZE_TEST_REDIS_CONTAINER:-breeze-redis-test}
    command: redis-server --appendonly no --save ""  # No persistence for speed
    ports:
      # Different port to avoid conflicts with dev. `pnpm test-stack` passes 0
      # to get an ephemeral host port for per-worktree isolation.
      - "${BREEZE_TEST_BIND_ADDR:-127.0.0.1}:${BREEZE_TEST_REDIS_PORT:-6380}:6379"
    networks:
      - breeze-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s

networks:
  breeze-test-network:
    driver: bridge
    # Must be unique per compose project: docker refuses to reuse a named
    # network created by a different project ("incorrect label" error), so
    # `pnpm test-stack` derives a per-project name here.
    name: ${BREEZE_TEST_NETWORK:-breeze-test-network}
